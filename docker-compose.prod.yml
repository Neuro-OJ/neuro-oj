# Neuro OJ 公测生产部署（Docker Compose）
#
# 用法：
#   cp .env.prod.example .env.prod
#   vim .env.prod
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# 仅 Nginx 容器对外暴露 HTTP 端口（TLS 由外部边缘终止）；core/judge/db/redis/minio 不暴露到宿主机。
# 镜像从 NOJ_IMAGE_REGISTRY 拉取，版本由 NOJ_VERSION 控制。
name: noj-prod

x-core-env: &core-env
  NOJ_ENV: production
  NOJ_PROJECT_ROOT: /app
  NOJ_MIGRATIONS_DIR: /app/drizzle
  PORT: "8000"
  DATABASE_URL: postgres://${POSTGRES_USER:-noj}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-noj}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  TFA_ENCRYPTION_KEY: ${TFA_ENCRYPTION_KEY:?TFA_ENCRYPTION_KEY is required}
  OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
  OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
  OAUTH_OIDC_ISSUER_URL: ${OAUTH_OIDC_ISSUER_URL:-}
  OAUTH_OIDC_CLIENT_ID: ${OAUTH_OIDC_CLIENT_ID:-}
  OAUTH_OIDC_CLIENT_SECRET: ${OAUTH_OIDC_CLIENT_SECRET:-}
  OAUTH_OIDC_NAME: ${OAUTH_OIDC_NAME:-OIDC}
  NOJ_LLM_SERVICE_TOKEN: ${NOJ_LLM_SERVICE_TOKEN:?NOJ_LLM_SERVICE_TOKEN is required}
  # 出站 LLM 网关地址：注入 evaluator 环境（judge 的 build_llm_env）供 LLM 题调用。
  NOJ_LLM_GATEWAY_URL: http://llm-gateway:8001
  # 内部健康/指标地址（**与上面的出站地址用途不同**，2026-09-12 评审 §5.3）：
  # 观测域 runtime-contract 用它构造 healthUrl/metricsUrl，默认值写的是
  # `http://noj-llm-gateway:8001`——那是开发编排的 container_name，生产 compose
  # 的服务名是 `llm-gateway`，不显式设置会指向不存在的 DNS 名。
  RUNTIME_LLM_GATEWAY_URL: http://llm-gateway:8001
  RUNTIME_JUDGE_MODE: ${RUNTIME_JUDGE_MODE:-heartbeat}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
  APP_URL: ${APP_URL:?APP_URL is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  NOJ_ALLOW_INSECURE_HTTP: ${NOJ_ALLOW_INSECURE_HTTP:-false}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:?TRUSTED_PROXIES is required}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:?STORAGE_PROVIDER is required}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_FORCE_PATH_STYLE: "true"
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:?EMAIL_PROVIDER is required}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  JUDGE_IMAGE_BASE: ${JUDGE_IMAGE_BASE-ghcr.io/neuro-oj/}
  # 评测任务队列前缀：必须与 judge 服务的 JUDGE_QUEUE 完全一致，
  # core 据此发布到 {prefix}:high / :medium / :low。
  JUDGE_QUEUE: ${JUDGE_QUEUE:-noj:judge:queue}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-90}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "5"

# ── 资源上限与日志轮转（2026-09-12 评审 §5.2）─────────────────────────
# 此前三个 compose 文件对 `mem_limit|cpus|deploy:|resources:|ulimits` 零命中，
# 且 `x-default-logging` 只被 migrate/core 引用 → 单机部署最常见、最致命的两类
# 故障（OOM 杀掉 postgres、日志打满磁盘导致全站写入失败）都没有防线。
# 现在**每个服务**都声明 mem_limit + logging，并可通过 env 覆盖。
# 注意：`mem_limit` 是 docker compose（非 swarm）语义；K8s 化时改用 resources.limits。
x-resource-defaults: &resource-defaults
  logging: *default-logging
  restart: unless-stopped

services:
  # ── 一次性初始化：迁移 + 系统数据 ───────────────────────────────
  migrate:
    # 资源上限（可用 env 覆盖）：防止单个服务 OOM 拖垮整机（评审 §5.2）
    mem_limit: "${MIGRATE_MEM_LIMIT:-1g}"
    image: "${NOJ_IMAGE_REGISTRY:-ghcr.io/neuro-oj}/noj-server:${NOJ_VERSION:?NOJ_VERSION is required}"
    logging: *default-logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /app/bin/noj db migrate &&
        /app/bin/noj init system
    environment:
      <<: *core-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - noj-net
    restart: "no"

  # ── 核心 API ──────────────────────────────────────────────────────
  core:
    # 资源上限（可用 env 覆盖）：防止单个服务 OOM 拖垮整机（评审 §5.2）
    mem_limit: "${CORE_MEM_LIMIT:-1g}"
    image: "${NOJ_IMAGE_REGISTRY:-ghcr.io/neuro-oj}/noj-server:${NOJ_VERSION:?NOJ_VERSION is required}"
    logging: *default-logging
    environment:
      <<: *core-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - noj-packages:/app/data/packages
      - noj-storage:/app/data/storage
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - noj-net

  # ── 前端 SSR ──────────────────────────────────────────────────────
  ui:
    logging: *default-logging
    # 资源上限（可用 env 覆盖）：防止单个服务 OOM 拖垮整机（评审 §5.2）
    mem_limit: "${UI_MEM_LIMIT:-1g}"
    image: "${NOJ_IMAGE_REGISTRY:-ghcr.io/neuro-oj}/noj-ui:${NOJ_VERSION:?NOJ_VERSION is required}"
    environment:
      NUXT_API_BASE: http://core:8000
      NUXT_NOJ_ENV: ${NUXT_NOJ_ENV:-production}
      NUXT_ALLOW_INSECURE_HTTP: ${NOJ_ALLOW_INSECURE_HTTP:-false}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
    depends_on:
      core:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - noj-net

  # ── 评测 Worker ───────────────────────────────────────────────────
  judge:
    logging: *default-logging
    # 资源上限（可用 env 覆盖）：防止单个服务 OOM 拖垮整机（评审 §5.2）
    mem_limit: "${JUDGE_MEM_LIMIT:-2g}"
    profiles:
      - judge
    image: "${NOJ_IMAGE_REGISTRY:-ghcr.io/neuro-oj}/noj-judge:${NOJ_VERSION:?NOJ_VERSION is required}"
    # 无 healthcheck，这是**有意为之**（2026-09-12 评审 §5.2）：
    # judge 是纯 worker，没有 HTTP 端口或心跳文件可供探测；它的失败模式是进程退出，
    # 已由 `restart: unless-stopped` 覆盖。写一个 `CMD true` 式的 healthcheck 只会
    # 制造"绿但无用"的假信号——正是本次评审要消除的那类缺陷。
    # 真正的存活/积压观测走 Prometheus 指标（noj_judge_workers / active_tasks /
    # queue_pending_jobs）与告警规则（deploy/monitoring/noj-alerts.yml），
    # 见 deploy/monitoring/README.md。若需要容器级探针，应先在 judge 内实现
    # "Redis 可达 + 无卡死任务"的自检子命令，而不是用假探针占位。
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      JUDGE_QUEUE: ${JUDGE_QUEUE:-noj:judge:queue}
      RESULT_QUEUE: ${RESULT_QUEUE:-noj:judge:results}
      JUDGE_PRIORITY_POLL_TIMEOUT_MS: ${JUDGE_PRIORITY_POLL_TIMEOUT_MS:-100}
      WORK_DIR: ${WORK_DIR:-/tmp/noj-judge}
      JUDGE_MAX_CONCURRENT_JUDGES: ${JUDGE_MAX_CONCURRENT_JUDGES:-2}
      JUDGE_CPU_LIMIT_MILLICORES: ${JUDGE_CPU_LIMIT_MILLICORES:-1000}
      JUDGE_MAX_EVALUATOR_TIME_MS: ${JUDGE_MAX_EVALUATOR_TIME_MS:-300000}
      JUDGE_MAX_SOLUTION_CALL_TIMEOUT_MS: ${JUDGE_MAX_SOLUTION_CALL_TIMEOUT_MS:-60000}
      JUDGE_IMAGE_PREFIX: ${JUDGE_IMAGE_PREFIX:-noj-}
      JUDGE_COMMAND_WHITELIST: ${JUDGE_COMMAND_WHITELIST:-python3,deno,node,bash,sh}
      JUDGE_ALLOW_EVALUATOR_NETWORK: ${JUDGE_ALLOW_EVALUATOR_NETWORK:-false}
      JUDGE_EVALUATOR_NETWORK: ${JUDGE_EVALUATOR_NETWORK:-noj-net}
      JUDGE_ALLOW_HTTP_S3: ${JUDGE_ALLOW_HTTP_S3:-false}
      JUDGE_DOCKER_HOST: ${JUDGE_DOCKER_HOST:-unix:///run/noj-judge/docker.sock}
      JUDGE_REQUIRE_ISOLATED_DOCKER: "true"
      SUPPORT_PACKAGE_DOWNLOAD_TIMEOUT: ${SUPPORT_PACKAGE_DOWNLOAD_TIMEOUT:-60}
      SUPPORT_CACHE_DIR: ${SUPPORT_CACHE_DIR:-/tmp/noj-judge/support-cache}
      SUPPORT_CACHE_MAX_ITEMS: ${SUPPORT_CACHE_MAX_ITEMS:-500}
      SUPPORT_CACHE_MAX_MB: ${SUPPORT_CACHE_MAX_MB:-2048}
    volumes:
      # 仅挂载独立 rootless Docker daemon 的 socket；禁止使用应用宿主机 socket。
      - ${JUDGE_DOCKER_SOCKET:-/run/noj-judge/docker.sock}:/run/noj-judge/docker.sock
      - judge-cache:/tmp/noj-judge
    user: "${JUDGE_UID:-10001}:${JUDGE_GID:-10001}"
    group_add:
      - "${JUDGE_DOCKER_SOCKET_GID:-10001}"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - noj-net

  # ── LLM Gateway ───────────────────────────────────────────────────
  llm-gateway:
    logging: *default-logging
    # 资源上限（可用 env 覆盖）：防止单个服务 OOM 拖垮整机（评审 §5.2）
    mem_limit: "${LLM_GATEWAY_MEM_LIMIT:-512m}"
    image: "${NOJ_IMAGE_REGISTRY:-ghcr.io/neuro-oj}/noj-llm-gateway:${NOJ_VERSION:?NOJ_VERSION is required}"
    environment:
      NOJ_LLM_PORT: "8001"
      NOJ_LLM_SERVICE_TOKEN: ${NOJ_LLM_SERVICE_TOKEN:?NOJ_LLM_SERVICE_TOKEN is required}
      NOJ_LLM_STORE_KEY: ${NOJ_LLM_STORE_KEY:?NOJ_LLM_STORE_KEY is required}
      NOJ_LLM_BYOK_ALLOWED_HOSTS: ${NOJ_LLM_BYOK_ALLOWED_HOSTS:-api.openai.com}
      NOJ_LLM_USER_RATE_LIMIT_PER_MINUTE: ${NOJ_LLM_USER_RATE_LIMIT_PER_MINUTE:-60}
      NOJ_LLM_IP_RATE_LIMIT_PER_MINUTE: ${NOJ_LLM_IP_RATE_LIMIT_PER_MINUTE:-60}
      DATABASE_URL: postgres://${POSTGRES_USER:-noj}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-noj}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      NOJ_LLM_DEFAULT_GLOBAL_DAY_CALLS: ${NOJ_LLM_DEFAULT_GLOBAL_DAY_CALLS:-10000}
      NOJ_LLM_DEFAULT_GLOBAL_DAY_TOKENS: ${NOJ_LLM_DEFAULT_GLOBAL_DAY_TOKENS:-1000000}
      NOJ_LLM_DEFAULT_GLOBAL_DAY_COST: ${NOJ_LLM_DEFAULT_GLOBAL_DAY_COST:-1000}
      NOJ_LLM_DEFAULT_USER_DAY_CALLS: ${NOJ_LLM_DEFAULT_USER_DAY_CALLS:-1000}
      NOJ_LLM_DEFAULT_USER_DAY_TOKENS: ${NOJ_LLM_DEFAULT_USER_DAY_TOKENS:-100000}
      NOJ_LLM_DEFAULT_USER_DAY_COST: ${NOJ_LLM_DEFAULT_USER_DAY_COST:-100}
      NOJ_LLM_DEFAULT_PROBLEM_DAY_CALLS: ${NOJ_LLM_DEFAULT_PROBLEM_DAY_CALLS:-5000}
      NOJ_LLM_DEFAULT_PROBLEM_DAY_TOKENS: ${NOJ_LLM_DEFAULT_PROBLEM_DAY_TOKENS:-500000}
      NOJ_LLM_DEFAULT_PROBLEM_DAY_COST: ${NOJ_LLM_DEFAULT_PROBLEM_DAY_COST:-500}
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - noj-net

  # ── 反向代理 / TLS ────────────────────────────────────────────────
  nginx:
    logging: *default-logging
    # 资源上限（可用 env 覆盖）：防止单个服务 OOM 拖垮整机（评审 §5.2）
    mem_limit: "${NGINX_MEM_LIMIT:-256m}"
    image: nginx:1.27-alpine@sha256:62223d644fa234c3a1cc785ee14242ec47a77364226f1c811d2f669f96dc2ac8
    ports:
      # 默认映射到宿主机 8080，避免与外部 TLS 终止层（如宿主机 Nginx）的 80 冲突；
      # 若直接由云 LB 转发 80，可设置 NGINX_PORT=80。
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ui:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - noj-net

  # ── 可观测性（可选）：docker compose --profile monitoring up -d ──────
  #
  # 2026-09-12 评审 §5.3：一键安装产出的系统此前**没有任何监控**（setup.sh /
  # noj-cli 对 prometheus|alertmanager 零命中，仅 README 有手工 docker run 指引），
  # 而 deploy/monitoring/ 下的告警规则与 runbook 又都齐全。
  # 现在把它们做成可选 profile：默认不启动（不影响最小部署），需要时一条命令获得
  # 指标采集 + 告警规则加载。
  #
  # Alertmanager 需要真实投递配置：把 deploy/monitoring/alertmanager.yml.example
  # 复制为 deploy/monitoring/alertmanager.yml 并填入接收器，否则该服务会启动失败
  # （这是有意的 fail-fast，而不是静默丢弃告警）。
  prometheus:
    profiles:
      - monitoring
    image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    logging: *default-logging
    mem_limit: "${PROMETHEUS_MEM_LIMIT:-1g}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/noj-alerts.yml:/etc/prometheus/rules/noj-alerts.yml:ro
      - ./deploy/monitoring/noj-slo-alerts.yml:/etc/prometheus/rules/noj-slo-alerts.yml:ro
      - promdata:/prometheus
    ports:
      # 默认只映射到宿主机回环，避免未加认证的指标端点暴露到公网；
      # 需要外部抓取时显式设置 PROMETHEUS_BIND（如 0.0.0.0）。
      - "${PROMETHEUS_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - noj-net

  alertmanager:
    profiles:
      - monitoring
    image: prom/alertmanager:v0.28.0@sha256:d5155cfac40a6d9250ffc97c19db2c5e190c7bc57c6b67125c94903358f8c7d8
    logging: *default-logging
    mem_limit: "${ALERTMANAGER_MEM_LIMIT:-256m}"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanagerdata:/alertmanager
    expose:
      - "9093"
    ports:
      - "${ALERTMANAGER_BIND:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    restart: unless-stopped
    networks:
      - noj-net

  # ── PostgreSQL ────────────────────────────────────────────────────
  postgres:
    logging: *default-logging
    # 资源上限（可用 env 覆盖）：防止单个服务 OOM 拖垮整机（评审 §5.2）
    mem_limit: "${POSTGRES_MEM_LIMIT:-2g}"
    image: postgres:16-alpine@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-noj}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noj} -d ${POSTGRES_DB:-noj}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - noj-net

  # ── Redis（带密码 + AOF）─────────────────────────────────────────
  redis:
    logging: *default-logging
    # 资源上限（可用 env 覆盖）：防止单个服务 OOM 拖垮整机（评审 §5.2）
    mem_limit: "${REDIS_MEM_LIMIT:-1g}"
    image: redis:7-alpine@sha256:1db42ccef14898aa29bae778452d567534b59c107129cbc1163fb552de184d3c
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - noj-net

  # ── MinIO（自建对象存储）─────────────────────────────────────────
  minio:
    logging: *default-logging
    # 资源上限（可用 env 覆盖）：防止单个服务 OOM 拖垮整机（评审 §5.2）
    mem_limit: "${MINIO_MEM_LIMIT:-1g}"
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z@sha256:d051d800a3025588f37f69f132bb5ef718547a9a4ee95ddee44e04ad952a0a96
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - miniodata:/data
    restart: unless-stopped
    networks:
      - noj-net

  # ── MinIO bucket 初始化（一次性，带重试等待 MinIO 就绪）──────────
  minio-init:
    logging: *default-logging
    # 资源上限（可用 env 覆盖）：防止单个服务 OOM 拖垮整机（评审 §5.2）
    mem_limit: "${MINIO_INIT_MEM_LIMIT:-256m}"
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        for i in $(seq 1 30); do
          if mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; then
            case "$$S3_BUCKET" in
              ""|*[!a-z0-9.-]*) echo "S3_BUCKET 包含非法字符" >&2; exit 1;;
            esac;
            if [ "$$S3_ACCESS_KEY" = "$$MINIO_ROOT_USER" ] || [ "$$S3_SECRET_KEY" = "$$MINIO_ROOT_PASSWORD" ]; then
              echo "S3 应用凭据不得复用 MinIO root 凭据" >&2; exit 1;
            fi;
            mc mb --ignore-existing "local/$$S3_BUCKET";
            policy=$$(cat /etc/noj/minio-policy.json.tpl);
            policy=$${policy//__S3_BUCKET__/$${S3_BUCKET}};
            printf '%s' "$${policy}" > /tmp/noj-minio-policy.json;
            mc admin policy remove local noj-support-packages-app >/dev/null 2>&1 || true;
            mc admin policy create local noj-support-packages-app /tmp/noj-minio-policy.json;
            mc admin user add local "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null 2>&1 || true;
            mc admin policy attach local noj-support-packages-app --user "$$S3_ACCESS_KEY";
            exit 0;
          fi;
          sleep 2;
        done;
        echo "MinIO 初始化失败：无法连接 MinIO" >&2;
        exit 1;
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
    volumes:
      - ./deploy/minio/noj-support-packages-policy.json.tpl:/etc/noj/minio-policy.json.tpl:ro
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    networks:
      - noj-net

networks:
  noj-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
  redisdata:
  miniodata:
  noj-packages:
  noj-storage:
  judge-cache:
  # 可观测性数据（仅 --profile monitoring 时使用）
  promdata:
  alertmanagerdata:
