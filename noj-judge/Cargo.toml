[package]
name = "noj-judge"
version = "0.10.4-rc.1"
edition = "2021"
description = "Neuro OJ 评测 Worker — 通过 Redis MQ 接收任务，Docker 沙箱执行评测"

[dependencies]
redis = { version = "0.27", features = ["tokio-comp"] }
tokio = { version = "1", features = ["full"] }
bollard = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util = "0.3"
tar = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
rand_core = "=0.10.1"
percent-encoding = "2"
filetime = "0.2"
tempfile = "3"
# OI WASM 后端：WASI 运行时与 fuel/线性内存限制。
wasmtime = { version = "=49.0.1", features = ["cranelift", "wat"] }
wasmtime-wasi = "=49.0.1"

[dev-dependencies]
serial_test = "3"
bytes = "1.12.1"
