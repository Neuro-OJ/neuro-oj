services:
  redis:
    image: redis:7-alpine
    container_name: noj-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: noj-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: noj
      POSTGRES_PASSWORD: noj
      POSTGRES_DB: noj
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: noj-minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address :9001
    restart: unless-stopped

  minio-init:
    # mc 与 server 不同期：mc 最新 stable 在 2025-08，server 当前用 2024-11。
    # mc 是命令行客户端，跨 server 大半年版本无协议不兼容风险，比对齐版本更稳。
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/noj-support-packages;
      echo 'MinIO bucket initialized';
      "

  llm-gateway:
    build: ./noj-llm-gateway
    container_name: noj-llm-gateway
    ports:
      - "8001:8001"
    environment:
      NOJ_LLM_PORT: "8001"
      NOJ_LLM_SERVICE_TOKEN: ${NOJ_LLM_SERVICE_TOKEN:-dev-llm-service-token-0123456789abcdef}
      NOJ_LLM_STORE_KEY: ${NOJ_LLM_STORE_KEY:-dev-llm-store-key-0123456789abcdef}
      DATABASE_URL: postgres://noj:noj@postgres:5432/noj
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  minio-data:
