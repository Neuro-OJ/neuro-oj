# Neuro OJ 公测反向代理（Nginx，容器内只处理 HTTP）
#
# 说明：容器内的 Nginx 不处理 TLS。TLS 终止由宿主机 Nginx / Caddy /
# 云负载均衡等外部边缘完成，再将 HTTP 流量转发到本容器的 80 端口。
#
# 若外部边缘已设置 X-Forwarded-Proto=https，noj-ui/noj-core 会据此生成
# Secure Cookie 与正确跳转。
#
# 所有业务流量转发到 noj-ui（ui:3000）；/healthz 单独转发到 noj-core。

server {
    listen 80;
    server_name _;

    # 默认档：普通业务请求（JSON/表单）。上传端点在下面对应 location 单独放宽，
    # 契约见 dev-docs/engineering/upload-limits.md（代理上限必须 ≥ 应用上限）。
    client_max_body_size 64m;

    # 基础安全响应头（HSTS 等由外部 TLS 终止层负责）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; media-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; media-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report" always;

    # 上游应用也会为直连部署设置安全头。边缘层是本部署路径的唯一输出层，
    # 先隐藏上游同名头，避免浏览器把重复 CSP 合并为意外的更严格策略。
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Security-Policy-Report-Only;

    # 运维探活：直接打到 noj-core readiness；依赖异常时返回 503
    location = /healthz {
        proxy_pass http://core:8000/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 内部端点（排空、内部服务）只允许容器内网直连 core，公网一律 404。
    # 用 `^~` 前缀匹配：命中后不再尝试验证下面的正则 location；且前缀 location
    # 的优先级高于 `location /`。正则 location 必须先于它书写或无法与 `^~` 竞争，
    # 因此这里放在正则 location 之前，语义更直观。大小写变体由 Nitro 代理再兜底。
    location ^~ /api/v1/internal/ {
        return 404;
    }

    # ── 上传端点分档（2026-11-02 审计 F6）──────────────────────────────
    # 改动这里必须同步 dev-docs/engineering/upload-limits.md 与
    # noj-core 的上限常量；scripts/check-upload-limits.ts 会校验两者一致。
    #
    # 题包导入 / 支持包 / 题面文件保存：应用上限 128 MiB
    location ~ ^/api/v1/(domains/[a-z0-9-]+/)?problems(/[^/]+)?/(import-bundle|support-package|files/save)$ {
        proxy_pass http://ui:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 128m;
        # 流式转发：不要把整个上传读进 nginx 临时文件再转发
        proxy_request_buffering off;
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # 产物提交：应用硬上限默认 2 GiB（NOJ_ARTIFACT_MAX_SIZE_MB 可覆盖）
    location ~ ^/api/v1/(domains/[a-z0-9-]+/)?(submissions|contests/[^/]+/problems/[^/]+/submissions)$ {
        proxy_pass http://ui:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2048m;
        proxy_request_buffering off;
        client_body_timeout 1800s;
        proxy_read_timeout 1800s;
        proxy_buffering off;
    }

    # 其余流量全部交给 noj-ui（Nitro 内部代理 /api 到 noj-core）
    location / {
        proxy_pass http://ui:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE / 长连接
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
