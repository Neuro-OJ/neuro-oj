global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/noj-alerts.yml

scrape_configs:
  # Prometheus 应加入 noj-net，core 只在内部网络暴露 8000 端口。
  - job_name: noj-core
    metrics_path: /metrics
    static_configs:
      - targets: ["core:8000"]

  # 可选：宿主机安装 node_exporter 后填写实际地址，用于宿主机磁盘告警。
  # - job_name: node
  #   static_configs:
  #     - targets: ["node-exporter:9100"]
