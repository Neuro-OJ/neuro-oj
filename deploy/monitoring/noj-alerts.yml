groups:
  - name: noj-slo-burn-rate
    rules:
      - record: noj:slo:api_availability:burn_rate
        expr: |
          (1 - sum(rate(noj_http_requests_total{status!~"5.."}[5m])) / sum(rate(noj_http_requests_total[5m]))) / (1 - 0.995)
      - alert: NojSloBurnRateApiAvailability
        expr: noj:slo:api_availability:burn_rate > 1
        for: 5m
        labels:
          severity: critical
          slo: api_availability
        annotations:
          summary: 核心 API 可用性 错误预算消耗过快
          runbook: deploy/monitoring/runbooks/api-availability.md
      - record: noj:slo:submission_e2e_latency:burn_rate
        expr: |
          (1 - noj_submission_e2e_duration_seconds) / (1 - 0.95)
      - alert: NojSloBurnRateSubmissionE2eLatency
        expr: noj:slo:submission_e2e_latency:burn_rate > 1
        for: 5m
        labels:
          severity: critical
          slo: submission_e2e_latency
        annotations:
          summary: 提交端到端延迟 错误预算消耗过快
          runbook: deploy/monitoring/runbooks/submission-e2e-latency.md
      - record: noj:slo:queue_oldest_pending_age:burn_rate
        expr: |
          (1 - noj_queue_oldest_pending_age_seconds) / (1 - 0.99)
      - alert: NojSloBurnRateQueueOldestPendingAge
        expr: noj:slo:queue_oldest_pending_age:burn_rate > 1
        for: 5m
        labels:
          severity: critical
          slo: queue_oldest_pending_age
        annotations:
          summary: 队列最老 pending 年龄 错误预算消耗过快
          runbook: deploy/monitoring/runbooks/queue-oldest-pending-age.md
      - record: noj:slo:result_delivery_latency:burn_rate
        expr: |
          (1 - noj_result_delivery_duration_seconds) / (1 - 0.99)
      - alert: NojSloBurnRateResultDeliveryLatency
        expr: noj:slo:result_delivery_latency:burn_rate > 1
        for: 5m
        labels:
          severity: critical
          slo: result_delivery_latency
        annotations:
          summary: 结果回传延迟 错误预算消耗过快
          runbook: deploy/monitoring/runbooks/result-delivery-latency.md
      - record: noj:slo:evaluation_throughput:burn_rate
        expr: |
          (1 - noj_evaluation_throughput_total) / (1 - 0.99)
      - alert: NojSloBurnRateEvaluationThroughput
        expr: noj:slo:evaluation_throughput:burn_rate > 1
        for: 5m
        labels:
          severity: critical
          slo: evaluation_throughput
        annotations:
          summary: 评测吞吐 错误预算消耗过快
          runbook: deploy/monitoring/runbooks/evaluation-throughput.md
