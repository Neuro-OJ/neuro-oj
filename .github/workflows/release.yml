# =============================================================================
# Neuro OJ 公测发布：构建并推送 ghcr.io 镜像
#
# 触发条件：
#   - GitHub Release 发布（release: published）
#   - 手动 workflow_dispatch（补发）
#
# 不在 push / pull_request 上触发。
# 每次 Release 构建并推送 7 个镜像：
#   noj-core / noj-ui / noj-judge / noj-llm-gateway / noj-evaluator-python / noj-solution-python / noj-solution-ai
# 平台：linux/amd64（公测阶段只支持 amd64）
# =============================================================================

name: Release Images

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # GHA 缓存（docker build-push-action cache-to=type=gha）需要写入权限
  actions: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: neuro-oj

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: noj-core
            context: noj-core
            file: noj-core/Dockerfile
          - name: noj-ui
            context: noj-ui
            file: noj-ui/Dockerfile
          - name: noj-judge
            context: noj-judge
            file: noj-judge/Dockerfile
          - name: noj-llm-gateway
            context: noj-llm-gateway
            file: noj-llm-gateway/Dockerfile
          - name: noj-evaluator-python
            context: noj-judge
            file: noj-judge/docker/evaluator-python/Dockerfile
          - name: noj-solution-python
            context: noj-judge
            file: noj-judge/docker/solution-python/Dockerfile
          - name: noj-solution-ai
            context: noj-judge
            file: noj-judge/docker/solution-ai/Dockerfile

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 计算镜像标签
        id: meta
        run: |
          VERSION="${{ github.event.release.tag_name || github.ref_name }}"
          if [ -z "$VERSION" ]; then
            echo "::error::无法确定 Release 版本号"
            exit 1
          fi
          TAGS="$REGISTRY/$IMAGE_NAMESPACE/${{ matrix.name }}:${VERSION}"
          TAGS="$TAGS,$REGISTRY/$IMAGE_NAMESPACE/${{ matrix.name }}:latest"
          if [ "${{ github.event.release.prerelease == true }}" = "true" ]; then
            TAGS="$TAGS,$REGISTRY/$IMAGE_NAMESPACE/${{ matrix.name }}:beta"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=min
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
