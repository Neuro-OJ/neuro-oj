# =============================================================================
# Neuro OJ 生产镜像发布：预发布候选 → 安全门禁 → 镜像/CLI 资产就绪 → 自动转正
#
# 触发条件：GitHub Release published/prereleased（仅预发布）或 workflow_dispatch。
# 普通 push / pull_request / 直接 published 不发布生产镜像。
#
# 就绪窗口控制（issue #431）：预发布 Release 先触发本工作流完成镜像构建、扫描、
# 签名、验证与 noj-cli 资产上传，最后的 publish-release 任务把预发布转正为正式
# Release。用户可见的正式版本因此总是具备同版本镜像与 CLI 资产；
# 安装器（scripts/deploy/install.sh）同时只选择非 draft、非 prerelease 且
# 已包含 CLI 资产的 Release，双重避免"版本可见但资产未就绪"。
# 每次 Release 构建并推送 7 个镜像，平台为 linux/amd64（公测阶段只支持 amd64）。
# =============================================================================

name: Release Images

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: neuro-oj

jobs:
  publish-cli:
    name: 发布生产运维 CLI
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == true
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: 验证 CLI 与生产安装链路
        working-directory: noj-cli
        run: |
          deno task check
          deno task test
          deno task test:production
      - name: 编译、冒烟验证并生成校验文件
        working-directory: noj-cli
        run: |
          deno task build:cli
          ./bin/noj-cli-linux-amd64 --help
          cd bin
          sha256sum noj-cli-linux-amd64 > noj-cli-linux-amd64.sha256
      - name: 发布同版本二进制资产
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          gh release upload "$VERSION" \
            noj-cli/bin/noj-cli-linux-amd64 \
            noj-cli/bin/noj-cli-linux-amd64.sha256 \
            --clobber

  supply-chain-check:
    name: 检查供应链配置
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查生产发布约束
        run: bash scripts/release/check-supply-chain.sh

  build-and-gate:
    name: Build and gate ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == true
    needs: supply-chain-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: noj-server
            context: noj-core
            file: noj-core/Dockerfile
          - name: noj-ui
            context: noj-ui
            file: noj-ui/Dockerfile
          - name: noj-judge
            context: noj-judge
            file: noj-judge/Dockerfile
          - name: noj-llm-gateway
            context: noj-llm-gateway
            file: noj-llm-gateway/Dockerfile
          - name: noj-evaluator-python
            context: noj-judge
            file: noj-judge/docker/evaluator-python/Dockerfile
          - name: noj-solution-python
            context: noj-judge
            file: noj-judge/docker/solution-python/Dockerfile
          - name: noj-solution-ai
            context: noj-judge
            file: noj-judge/docker/solution-ai/Dockerfile

    steps:
      - name: 检查触发来源必须是预发布
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == "release" && "$PRERELEASE" != "true" ]]; then
            echo "::error::生产镜像只允许从 prerelease 触发；请先创建预发布版本，资产就绪后由工作流自动转正。"
            exit 1
          fi

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 安装 Cosign
        uses: sigstore/cosign-installer@v3.10.1

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算候选与 Release 标签
        id: meta
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
        run: |
          set -Eeuo pipefail
          version="${{ github.event.release.tag_name || github.ref_name }}"
          if [[ ! "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本必须是合法 Release tag（例如 v0.1.0 或 0.1.1-rc.1）：$version"
            exit 1
          fi
          candidate="$IMAGE:${version}-build.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          release="$IMAGE:$version"
          {
            echo "version=$version"
            echo "candidate=$candidate"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      - name: 构建并推送候选镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.candidate }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 扫描候选镜像漏洞
        # v0.28.0 会引用不存在的 setup-trivy@v0.2.1，导致任务在构建前直接失败。
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.candidate }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: 生成候选镜像 SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.candidate }}
          format: spdx-json
          output: sbom-${{ matrix.name }}.spdx.json
          vuln-type: os,library
          exit-code: "0"

      - name: 上传 SBOM 文件
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}-${{ steps.meta.outputs.version }}
          path: sbom-${{ matrix.name }}.spdx.json
          if-no-files-found: error
          retention-days: 90

      - name: 签名候选 digest 并附加 SBOM attestation
        env:
          COSIGN_YES: "true"
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          cosign sign "$IMAGE@$DIGEST"
          cosign attest \
            --type spdxjson \
            --predicate "sbom-${{ matrix.name }}.spdx.json" \
            "$IMAGE@$DIGEST"

      - name: 绑定 GitHub 构建来源证明
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: 发布正式 Release 标签
        env:
          SOURCE: ${{ steps.meta.outputs.candidate }}
          TARGET: ${{ steps.meta.outputs.release }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          # 正式标签不可变：已存在且指向不同构建时拒绝覆盖，防止重试混用版本。
          existing="$(docker buildx imagetools inspect "$TARGET" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)"
          if [[ -n "$existing" ]]; then
            [[ "$existing" == "$DIGEST" ]] || {
              echo "::error::正式标签 $TARGET 已存在且指向不同构建（$existing != $DIGEST），禁止覆盖；请使用新版本号。"
              exit 1
            }
            echo "正式标签已存在且 digest 一致（幂等重试），跳过重新打标"
            exit 0
          fi
          docker buildx imagetools create --tag "$TARGET" "$SOURCE@$DIGEST"
          actual="$(docker buildx imagetools inspect "$TARGET" | awk '/^Digest:/ {print $2; exit}')"
          [[ "$actual" == "$DIGEST" ]] || {
            echo "::error::正式标签 digest 不匹配：期望 $DIGEST，实际 $actual"
            exit 1
          }

      - name: 设置 GHCR 包可见性为 public
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
        run: |
          set -Eeuo pipefail
          owner="${{ github.repository_owner }}"
          pkg="${IMAGE#ghcr.io/}"
          name="${pkg#*/}"
          if gh api -X POST "/orgs/$owner/packages/container/$name/visibility" \
            -f visibility=public >/dev/null 2>&1; then
            echo "已设置 $IMAGE 为 public（org 包）"
          elif gh api -X POST "/users/$owner/packages/container/$name/visibility" \
            -f visibility=public >/dev/null 2>&1; then
            echo "已设置 $IMAGE 为 public（user 包）"
          else
            echo "::warning::无法自动设置 $IMAGE 为 public，请手动在 GHCR 包设置中改为 public"
          fi

      - name: 保存发布元数据
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s %s %s\n' "$IMAGE" "$VERSION" "$DIGEST" > release-${{ matrix.name }}.txt

      - name: 上传发布元数据
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata-${{ matrix.name }}
          path: release-${{ matrix.name }}.txt
          if-no-files-found: error
          retention-days: 90

  verify-release:
    name: 验证正式 Release 镜像
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == true
    needs: build-and-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 安装 Cosign
        uses: sigstore/cosign-installer@v3.10.1

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载发布元数据
        uses: actions/download-artifact@v4
        with:
          pattern: release-metadata-*
          path: release-metadata
          merge-multiple: true

      - name: 验证 digest、签名、来源证明和 smoke test
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          files=(release-metadata/release-*.txt)
          [[ "${#files[@]}" -eq 7 ]] || {
            echo "::error::发布元数据数量错误，期望 7，实际 ${#files[@]}"
            exit 1
          }

          for metadata in "${files[@]}"; do
            read -r image version digest < "$metadata"
            release="$image:$version"
            actual="$(docker buildx imagetools inspect "$release" | awk '/^Digest:/ {print $2; exit}')"
            [[ "$actual" == "$digest" ]] || {
              echo "::error::$release digest 不匹配：期望 $digest，实际 $actual"
              exit 1
            }

            cosign verify \
              --certificate-identity-regexp "^https://github.com/${REPOSITORY}/.github/workflows/release.yml@.*$" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$image@$digest" >/dev/null

            cosign verify-attestation \
              --type spdxjson \
              --certificate-identity-regexp "^https://github.com/${REPOSITORY}/.github/workflows/release.yml@.*$" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$image@$digest" >/dev/null

            gh attestation verify "oci://$image@$digest" \
              --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/release.yml" >/dev/null

            docker pull "$image@$digest" >/dev/null
            case "$image" in
              */noj-server)
                docker run --rm --entrypoint /bin/sh "$image@$digest" -c \
                  'test -x /app/bin/noj-server && test -x /app/bin/noj && test "$(id -u)" != 0'
                ;;
              */noj-ui)
                docker run --rm --entrypoint /bin/sh "$image@$digest" -c \
                  'test -x /app/noj-ui && test "$(id -u)" != 0'
                ;;
              */noj-judge)
                docker run --rm --entrypoint /bin/sh "$image@$digest" -c \
                  'test -x /usr/local/bin/noj-judge && test "$(id -u)" != 0'
                ;;
              */noj-llm-gateway)
                docker run --rm --entrypoint /bin/sh "$image@$digest" -c \
                  'command -v deno >/dev/null && test "$(id -u)" != 0'
                ;;
              */noj-evaluator-python|*/noj-solution-python|*/noj-solution-ai)
                docker run --rm --entrypoint python3 "$image@$digest" -c \
                  'import sys; assert sys.version_info >= (3, 12)'
                ;;
              *)
                echo "::error::未覆盖的发布镜像：$image"
                exit 1
                ;;
            esac
            echo "已验证 $release@$digest"
          done

  publish-release:
    name: 资产就绪后转正 Release
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == true
    needs: [verify-release, publish-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: 将预发布转正为正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -Eeuo pipefail
          # 此时镜像标签、签名、SBOM/来源证明与 noj-cli 资产均已就绪，
          # 转正后 /releases/latest 才会指向该版本，安装器即可选择它。
          gh release edit "$VERSION" --draft=false --prerelease=false --latest
          echo "Release $VERSION 已转正为最新正式版本"
