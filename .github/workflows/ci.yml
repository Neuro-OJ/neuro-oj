# =============================================================================
# Neuro OJ CI Pipeline
#
# 触发条件：全分支 Push 和 Pull Request
# 并行检查三个模块：
#   - noj-core: Deno 后端（格式/代码检查/集成测试，需 PostgreSQL + Redis）
#   - noj-ui:   Nuxt 4 前端（Deno 构建检查）
#   - noj-judge: Rust Worker（格式/Clippy/单元测试）
#
# 性能优化（2026-07）：
#   - 引入 dorny/paths-filter：PR 上按改动模块只跑相关 job
#     （改 noj-ui 不再触发 judge/core 全套；push main / 手动触发仍全量）
#   - 删除冗余 core-fmt / core-lint（core-quick-check 已覆盖 fmt+lint+typecheck）
#   - judge-fmt / judge-clippy / judge-test 合并为 judge-check 单 job：
#     共享同一 target 目录只编译一次，同时消除原 clippy/test 两 job
#     用相同 cargo cache key 互相覆盖的问题
# =============================================================================

name: CI

# workflow-level 最小权限：所有 job 默认 contents: read；如需写权限再按 job
# 单独收窄 scope。修复 finding S3：之前 GITHUB_TOKEN 默认是 write-all，
# 风险敞口包括 gh release create / gh pr comment 等不必要的写操作。
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支/PR 的新推送自动取消旧运行，避免排队浪费。
# 修复 finding M4：之前 `cancel-in-progress: true` 对 main 推送也生效，
# 一次 force-push 就会丢失 main 分支的 CI coverage。改为仅在 PR 上取消，
# main 推送必须跑完，保留质量门禁记录。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production-cli:
    name: Production CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: 检查 CLI 与离线生产安装流程
        working-directory: noj-cli
        run: |
          deno task check
          deno task test
          deno task test:production


  # ===========================================================================
  # 生产镜像供应链配置检查：在 PR 阶段提前阻止 latest 和未固定 digest 回归。
  # ===========================================================================
  supply-chain:
    name: Production Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查供应链约束
        run: bash scripts/release/test-supply-chain.sh

  # ===========================================================================
  # 变更检测（dorny/paths-filter）
  #
  # PR 上按改动路径生成 core/ui/judge 三个模块 flag；各模块 job 据此
  # 条件化执行。push main 与 workflow_dispatch 始终全量执行（质量门禁）。
  # ci.yml 自身改动视为三模块皆变更，保证 CI 配置调整会被完整验证。
  # ===========================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      core: ${{ steps.filter.outputs.core }}
      core-domains: ${{ steps.domains.outputs.core-domains }}
      ui: ${{ steps.filter.outputs.ui }}
      judge: ${{ steps.filter.outputs.judge }}
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # paths-filter 需要比较 base/head，push 事件需完整历史
          fetch-depth: 0

      - name: 按模块与 Domain 路径过滤
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'noj-core/**'
              - 'scripts/**'
              - 'docker-compose.e2e.yml'
              - 'env.e2e.template'
              - '.github/workflows/ci.yml'
            core-identity:
              - 'noj-core/src/domains/identity/**'
            core-catalog:
              - 'noj-core/src/domains/catalog/**'
            core-submission:
              - 'noj-core/src/domains/submission/**'
            core-contest:
              - 'noj-core/src/domains/contest/**'
            core-system:
              - 'noj-core/src/domains/system/**'
            core-community:
              - 'noj-core/src/domains/community/**'
            core-messaging:
              - 'noj-core/src/domains/messaging/**'
            core-objective:
              - 'noj-core/src/domains/objective/**'
            core-admin:
              - 'noj-core/src/domains/admin/**'
            core-search:
              - 'noj-core/src/domains/search/**'
            core-query:
              - 'noj-core/src/domains/query/**'
            core-gateway:
              - 'noj-core/src/domains/gateway/**'
            core-content-review:
              - 'noj-core/src/domains/content-review/**'
            core-observability:
              - 'noj-core/src/domains/observability/**'
            core-shared:
              - 'noj-core/src/shared/**'
              - 'noj-core/src/routes/**'
              - 'noj-core/src/app.ts'
              - 'noj-core/src/main.ts'
              - 'noj-core/src/mod.ts'
              - 'noj-core/drizzle/**'
              - 'noj-core/tests/**'
              # noj-core 非 src 路径：此前只被 core-test-unit/db 的 noj-core/**
              # 覆盖，拆域后必须显式列出，否则改 deno.json/脚本会零测试触发
              - 'noj-core/scripts/**'
              - 'noj-core/deno.json'
              - 'noj-core/deno.lock'
              - 'noj-core/drizzle.config.ts'
              - 'noj-core/package.json'
              - 'noj-core/data/**'
              - 'scripts/**'
              - 'docker-compose.e2e.yml'
              - 'env.e2e.template'
              - '.github/workflows/ci.yml'
            ui:
              - 'noj-ui/**'
              - '.github/workflows/ci.yml'
            judge:
              - 'noj-judge/**'
              - 'docker-compose.e2e.yml'
              - 'env.e2e.template'
              - '.github/workflows/ci.yml'
            gateway:
              - 'noj-llm-gateway/**'
              - 'noj-tests/fixtures/**'
              - 'scripts/**'
              - 'docker-compose.e2e.yml'
              - 'env.e2e.template'
              - '.github/workflows/ci.yml'

      - name: 计算受影响 core-domains
        id: domains
        env:
          CORE_IDENTITY: ${{ steps.filter.outputs.core-identity }}
          CORE_CATALOG: ${{ steps.filter.outputs.core-catalog }}
          CORE_SUBMISSION: ${{ steps.filter.outputs.core-submission }}
          CORE_CONTEST: ${{ steps.filter.outputs.core-contest }}
          CORE_SYSTEM: ${{ steps.filter.outputs.core-system }}
          CORE_COMMUNITY: ${{ steps.filter.outputs.core-community }}
          CORE_MESSAGING: ${{ steps.filter.outputs.core-messaging }}
          CORE_OBJECTIVE: ${{ steps.filter.outputs.core-objective }}
          CORE_ADMIN: ${{ steps.filter.outputs.core-admin }}
          CORE_SEARCH: ${{ steps.filter.outputs.core-search }}
          CORE_QUERY: ${{ steps.filter.outputs.core-query }}
          CORE_GATEWAY: ${{ steps.filter.outputs.core-gateway }}
          CORE_CONTENT_REVIEW: ${{ steps.filter.outputs.core-content-review }}
          CORE_OBSERVABILITY: ${{ steps.filter.outputs.core-observability }}
          CORE_SHARED: ${{ steps.filter.outputs.core-shared }}
        run: |
          python3 - <<'PY'
          import json, os
          def flag(name):
              return os.environ.get(name, '') == 'true'
          all_core = ["identity","catalog","submission","contest","system","community","messaging","objective","admin","search","query","gateway","content-review","observability"]
          core_domains = []
          if flag('CORE_SHARED'):
              core_domains = all_core[:]
          else:
              for d in all_core:
                  if flag(f'CORE_{d.upper().replace("-", "_")}'):
                      core_domains.append(d)
          if flag('CORE_SHARED'):
              core_domains.append('shared')
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"core-domains={json.dumps(core_domains)}\n")
          PY

  # ===========================================================================
  # noj-core — 快速静态检查（fmt + lint + typecheck，无外部服务）
  #
  # 目的：把 lint / 格式 / 类型错误在 30 秒内暴露，避免 core-test 跑满 15 分钟
  # 才反馈。所有静态检查失败应在此层就被拦下。
  # 修复 PR-2 review finding F3：原 CI 设计要求开发者在 PR 上等到
  # 接近 15 分钟才收到 "deno fmt 没过" 这种秒级就能发现的问题。
  # ===========================================================================
  core-quick-check:
    name: Core Quick Check
    needs: changes
    # PR 按模块过滤；push main / 手动触发全量
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 缓存 Deno 依赖
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/noj-core/.deno_cache
          key: deno-quick-${{ hashFiles('noj-core/deno.lock', 'noj-core/deno.json') }}
          restore-keys: |
            deno-quick-

      - name: 格式检查 (deno fmt --check)
        working-directory: noj-core
        run: deno fmt --check

      - name: 代码检查 (deno lint)
        working-directory: noj-core
        run: deno lint

      - name: 类型检查 (deno check)
        working-directory: noj-core
        # 排除 tests/：测试中用 Deno.test 包装的 import 由 deno test -A 解析，
        # 单文件 check 会因 import.meta 等特性报"未使用"，噪音大于价值。
        # 用 find+xargs 是因为 87 个 .ts 文件 shell glob 展开会超 E2BIG (os error 7)。
        run: find src -name '*.ts' -print0 | xargs -0 deno check

      - name: 导出 JSDoc 覆盖率检查
        working-directory: noj-core
        run: deno task check:jsdoc

      # 不在 CI 跑 check:env:strict：脚本是给本地开发者用的工具，
      # CI 环境使用 GitHub Secrets 而非 .env。
      # 强行 cp .env.example .env 会触发模板里"故意写的占位符"
      # （JWT_SECRET=change-this-...），产生误报。

  # ===========================================================================
  # noj-llm-gateway — 快速静态检查 + 单元测试
  # ===========================================================================
  gateway-check:
    name: Gateway Check
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.gateway == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 缓存 Deno 依赖
        uses: actions/cache@v4
        with:
          path: |
            noj-llm-gateway/.deno_cache
          key: gateway-deno-${{ hashFiles('noj-llm-gateway/deno.lock', 'noj-llm-gateway/deno.json') }}

      - name: 格式检查 (deno fmt)
        working-directory: noj-llm-gateway
        run: deno fmt --check

      - name: Lint (deno lint)
        working-directory: noj-llm-gateway
        run: deno lint

      - name: 类型检查 (deno check)
        working-directory: noj-llm-gateway
        run: deno check src/mod.ts

      - name: 单元测试 (deno test)
        working-directory: noj-llm-gateway
        run: deno test -A --no-check

      - name: 导出 JSDoc 覆盖率检查
        working-directory: noj-llm-gateway
        run: deno task check:jsdoc

  # ===========================================================================
  # 仓库级门禁（Agent Note / Markdown 链接 / 导出 JSDoc）
  # ===========================================================================
  root-gates:
    name: Root Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 仓库级门禁
        run: deno run -A scripts/check-ci.ts

  # ===========================================================================
  # 真实入口 Smoke（源码入口 + 已构建产物）
  # ===========================================================================
  entrypoint-smoke:
    name: Entrypoint Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 入口 Smoke
        run: deno run -A scripts/smoke-entrypoints.ts

  # ===========================================================================
  # 覆盖率门禁（noj-llm-gateway / noj-ui）
  # ===========================================================================
  coverage-check:
    name: Coverage Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 覆盖率报告 + 模块阈值门禁
        # 模块 deno.json 的 test:coverage 自带 --threshold；--check 让其退出码生效。
        run: deno run -A scripts/coverage-report.ts --report --check
      - name: 静默跳过扫描（报告）
        run: deno run -A scripts/silent-skip-report.ts
      - name: 上传测试治理报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-governance-reports
          path: |
            dev-docs/engineering/test-coverage.md
            dev-docs/engineering/test-silent-skips.md
          retention-days: 14
          if-no-files-found: warn

  # ===========================================================================
  # noj-core — Domain 单元/集成测试（独立 job）
  #
  # 每个 Domain 一个独立 job，自带 PostgreSQL + Redis；共享测试由 core-shared
  # 承担。PR 上按 Domain 级路径过滤，push main / workflow_dispatch 全量。
  # ===========================================================================
  core-identity:
    name: Core identity
    needs: changes
    if: ${{ github.event_name != 'pull_request' || contains(fromJson(needs.changes.outputs.core-domains), 'identity') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noj
          POSTGRES_PASSWORD: noj
          POSTGRES_DB: noj
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/
      DATABASE_URL: postgres://noj:noj@localhost:5432/noj
      NOJ_ENV: test
      DENO_DIR: ${{ github.workspace }}/noj-core/.deno_cache
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Inject or validate JWT_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -n "$JWT_SECRET" ]; then
            if [ "${#JWT_SECRET}" -lt 32 ]; then
              echo "::error::JWT_SECRET must be ≥32 chars (got ${#JWT_SECRET})"
              exit 1
            fi
            echo "JWT_SECRET 来源：仓库 Secret（trusted 环境配置）"
            echo "JWT_SECRET_SOURCE=repo-secret" >> "$GITHUB_ENV"
            echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          else
            JWT_SECRET="$(openssl rand -hex 32)"
            echo "JWT_SECRET 来源：本次运行生成的一次性随机密钥（Fork / Dependabot PR 隔离测试，issue #430）"
            echo "JWT_SECRET_SOURCE=random-per-run" >> "$GITHUB_ENV"
            echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          fi
      - name: 缓存 Deno 依赖
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/noj-core/.deno_cache
          key: deno-${{ hashFiles('noj-core/deno.lock', 'noj-core/deno.json') }}
          restore-keys: |
            deno-
      - name: 运行 Domain 测试
        working-directory: noj-core
        env:
          BCRYPT_SALT_ROUNDS: 4
        run: bash scripts/test-domain.sh identity
      - name: 上传失败日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: core-identity-logs
          path: |
            noj-core/test-logs/
            noj-core/test-output.log
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true

  core-catalog:
    name: Core catalog
    needs: changes
    if: ${{ github.event_name != 'pull_request' || contains(fromJson(needs.changes.outputs.core-domains), 'catalog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noj
          POSTGRES_PASSWORD: noj
          POSTGRES_DB: noj
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/
      DATABASE_URL: postgres://noj:noj@localhost:5432/noj
      NOJ_ENV: test
      DENO_DIR: ${{ github.workspace }}/noj-core/.deno_cache
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Inject or validate JWT_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -n "$JWT_SECRET" ]; then
            if [ "${#JWT_SECRET}" -lt 32 ]; then
              echo "::error::JWT_SECRET must be ≥32 chars (got ${#JWT_SECRET})"
              exit 1
            fi
            echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          else
            JWT_SECRET="$(openssl rand -hex 32)"
            echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          fi
      - name: 缓存 Deno 依赖
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/noj-core/.deno_cache
          key: deno-${{ hashFiles('noj-core/deno.lock', 'noj-core/deno.json') }}
          restore-keys: |
            deno-
      - name: 运行 Domain 测试
        working-directory: noj-core
        env:
          BCRYPT_SALT_ROUNDS: 4
        run: bash scripts/test-domain.sh catalog
      - name: 上传失败日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: core-catalog-logs
          path: |
            noj-core/test-logs/
            noj-core/test-output.log
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true

  core-submission:
    name: Core submission
    needs: changes
    if: ${{ github.event_name != 'pull_request' || contains(fromJson(needs.changes.outputs.core-domains), 'submission') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noj
          POSTGRES_PASSWORD: noj
          POSTGRES_DB: noj
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/
      DATABASE_URL: postgres://noj:noj@localhost:5432/noj
      NOJ_ENV: test
      DENO_DIR: ${{ github.workspace }}/noj-core/.deno_cache
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Inject or validate JWT_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -n "$JWT_SECRET" ]; then
            if [ "${#JWT_SECRET}" -lt 32 ]; then
              echo "::error::JWT_SECRET must be ≥32 chars (got ${#JWT_SECRET})"
              exit 1
            fi
            echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          else
            JWT_SECRET="$(openssl rand -hex 32)"
            echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          fi
      - name: 缓存 Deno 依赖
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/noj-core/.deno_cache
          key: deno-${{ hashFiles('noj-core/deno.lock', 'noj-core/deno.json') }}
          restore-keys: |
            deno-
      - name: 运行 Domain 测试
        working-directory: noj-core
        env:
          BCRYPT_SALT_ROUNDS: 4
        run: bash scripts/test-domain.sh submission
      - name: 上传失败日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: core-submission-logs
          path: |
            noj-core/test-logs/
            noj-core/test-output.log
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true

  core-contest:
    name: Core contest
    needs: changes
