# =============================================================================
# Neuro OJ CI Pipeline
#
# 触发条件：全分支 Push 和 Pull Request
# 并行检查三个模块：
#   - noj-core: Deno 后端（格式/代码检查/集成测试，需 PostgreSQL + Redis）
#   - noj-ui:   Nuxt 4 前端（Deno 构建检查）
#   - noj-judge: Rust Worker（格式/Clippy/单元测试）
#
# 性能优化（2026-07）：
#   - 引入 dorny/paths-filter：PR 上按改动模块只跑相关 job
#     （改 noj-ui 不再触发 judge/core 全套；push main / 手动触发仍全量）
#   - 删除冗余 core-fmt / core-lint（core-quick-check 已覆盖 fmt+lint+typecheck）
#   - judge-fmt / judge-clippy / judge-test 合并为 judge-check 单 job：
#     共享同一 target 目录只编译一次，同时消除原 clippy/test 两 job
#     用相同 cargo cache key 互相覆盖的问题
# =============================================================================

name: CI

# workflow-level 最小权限：所有 job 默认 contents: read；如需写权限再按 job
# 单独收窄 scope。修复 finding S3：之前 GITHUB_TOKEN 默认是 write-all，
# 风险敞口包括 gh release create / gh pr comment 等不必要的写操作。
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支/PR 的新推送自动取消旧运行，避免排队浪费。
# 修复 finding M4：之前 `cancel-in-progress: true` 对 main 推送也生效，
# 一次 force-push 就会丢失 main 分支的 CI coverage。改为仅在 PR 上取消，
# main 推送必须跑完，保留质量门禁记录。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production-cli:
    name: Production CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: 检查 CLI 与离线生产安装流程
        working-directory: noj-cli
        run: |
          deno task check
          deno task test
          deno task test:production


  # ===========================================================================
  # 生产镜像供应链配置检查：在 PR 阶段提前阻止 latest 和未固定 digest 回归。
  # ===========================================================================
  supply-chain:
    name: Production Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查供应链约束
        run: bash scripts/release/test-supply-chain.sh

  # ===========================================================================
  # 变更检测（dorny/paths-filter）
  #
  # PR 上按改动路径生成 core/ui/judge 三个模块 flag；各模块 job 据此
  # 条件化执行。push main 与 workflow_dispatch 始终全量执行（质量门禁）。
  # ci.yml 自身改动视为三模块皆变更，保证 CI 配置调整会被完整验证。
  # ===========================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      core: ${{ steps.filter.outputs.core }}
      ui: ${{ steps.filter.outputs.ui }}
      judge: ${{ steps.filter.outputs.judge }}
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # paths-filter 需要比较 base/head，push 事件需完整历史
          fetch-depth: 0

      - name: 按模块路径过滤
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'noj-core/**'
              - 'scripts/**'
              - 'docker-compose.e2e.yml'
              - 'env.e2e.template'
              - '.github/workflows/ci.yml'
            ui:
              - 'noj-ui/**'
              - '.github/workflows/ci.yml'
            judge:
              - 'noj-judge/**'
              - 'docker-compose.e2e.yml'
              - 'env.e2e.template'
              - '.github/workflows/ci.yml'
            gateway:
              - 'noj-llm-gateway/**'
              - 'scripts/**'
              - 'docker-compose.e2e.yml'
              - 'env.e2e.template'
              - '.github/workflows/ci.yml'

  # ===========================================================================
  # noj-core — 快速静态检查（fmt + lint + typecheck，无外部服务）
  #
  # 目的：把 lint / 格式 / 类型错误在 30 秒内暴露，避免 core-test 跑满 15 分钟
  # 才反馈。所有静态检查失败应在此层就被拦下。
  # 修复 PR-2 review finding F3：原 CI 设计要求开发者在 PR 上等到
  # 接近 15 分钟才收到 "deno fmt 没过" 这种秒级就能发现的问题。
  # ===========================================================================
  core-quick-check:
    name: Core Quick Check
    needs: changes
    # PR 按模块过滤；push main / 手动触发全量
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 缓存 Deno 依赖
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/noj-core/.deno_cache
          key: deno-quick-${{ hashFiles('noj-core/deno.lock', 'noj-core/deno.json') }}
          restore-keys: |
            deno-quick-

      - name: 格式检查 (deno fmt --check)
        working-directory: noj-core
        run: deno fmt --check

      - name: 代码检查 (deno lint)
        working-directory: noj-core
        run: deno lint

      - name: 类型检查 (deno check)
        working-directory: noj-core
        # 排除 tests/：测试中用 Deno.test 包装的 import 由 deno test -A 解析，
        # 单文件 check 会因 import.meta 等特性报"未使用"，噪音大于价值。
        # 用 find+xargs 是因为 87 个 .ts 文件 shell glob 展开会超 E2BIG (os error 7)。
        run: find src -name '*.ts' -print0 | xargs -0 deno check

      - name: 导出 JSDoc 覆盖率检查
        working-directory: noj-core
        run: deno task check:jsdoc

      # 不在 CI 跑 check:env:strict：脚本是给本地开发者用的工具，
      # CI 环境使用 GitHub Secrets 而非 .env。
      # 强行 cp .env.example .env 会触发模板里"故意写的占位符"
      # （JWT_SECRET=change-this-...），产生误报。

  # ===========================================================================
  # noj-llm-gateway — 快速静态检查 + 单元测试
  # ===========================================================================
  gateway-check:
    name: Gateway Check
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.gateway == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 缓存 Deno 依赖
        uses: actions/cache@v4
        with:
          path: |
            noj-llm-gateway/.deno_cache
          key: gateway-deno-${{ hashFiles('noj-llm-gateway/deno.lock', 'noj-llm-gateway/deno.json') }}

      - name: 格式检查 (deno fmt)
        working-directory: noj-llm-gateway
        run: deno fmt --check

      - name: Lint (deno lint)
        working-directory: noj-llm-gateway
        run: deno lint

      - name: 类型检查 (deno check)
        working-directory: noj-llm-gateway
        run: deno check src/mod.ts

      - name: 单元测试 (deno test)
        working-directory: noj-llm-gateway
        run: deno test -A --no-check

      - name: 导出 JSDoc 覆盖率检查
        working-directory: noj-llm-gateway
        run: deno task check:jsdoc

  # ===========================================================================
  # 仓库级门禁（Agent Note / Markdown 链接 / 导出 JSDoc）
  # ===========================================================================
  root-gates:
    name: Root Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 仓库级门禁
        run: deno run -A scripts/check-ci.ts

  # ===========================================================================
  # 真实入口 Smoke（源码入口 + 已构建产物）
  # ===========================================================================
  entrypoint-smoke:
    name: Entrypoint Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 入口 Smoke
        run: deno run -A scripts/smoke-entrypoints.ts

  # ===========================================================================
  # 覆盖率门禁（noj-llm-gateway / noj-ui）
  # ===========================================================================
  coverage-check:
    name: Coverage Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 覆盖率检查
        run: deno run -A scripts/coverage-report.ts

  # ===========================================================================
  # noj-core — 快速冒烟测试（不依赖外部服务，使用 PGlite 内存数据库）
  # ===========================================================================
  core-smoke:
    name: Core Smoke
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    # 冒烟测试是唯一真实启动 Hono server 并验证 /health 的检查，必须在 main 推送 / 手动触发也执行，
    # 不只是 PR。core-test 直接 import router 不启 server，覆盖不到 HTTP 层。
    timeout-minutes: 5

    services:
      # PR-1 评审修订：smoke 测试现在调 authMiddleware（含 isJtiRevoked），
      # 必须在 Redis 可达环境下运行。加 redis 服务容器。
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 快速冒烟测试
        working-directory: noj-core
        env:
          REDIS_URL: redis://localhost:6379/
        run: deno task test:smoke

  # ===========================================================================
  # noj-core — 单元/轻量测试（PGlite 内存数据库 + Redis，无 PostgreSQL）
  #
  # 性能优化（2026-07）：原 core-test 单一 job 串行跑全部测试文件
  # （需 PG + Redis，最慢可达 15 min）。拆分为 unit / db 两个并行 job：
  #   - unit：tests/lib + middleware + types + data + app（纯逻辑 + PGlite，
  #     无需 PG service，Redis 供 loginThrottle/revokedTokens/searchRateLimit）
  #   - db：services + routes + mq + db + 迁移/种子（需要真实 PG 覆盖
  #     pg_trgm / tsvector / GIN 等专属路径）
  # 每组内仍串行（resetDbForTest 的 TRUNCATE 顺序假设），组间并行。
  # ===========================================================================
  core-test-unit:
    name: Core Test (Unit)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # lib/middleware 的 Redis 相关测试（loginThrottle / revokedTokens /
      # searchRateLimit）需要可达的 Redis
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379/
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NOJ_ENV: test
      DENO_DIR: ${{ github.workspace }}/noj-core/.deno_cache

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 缓存 Deno 依赖
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/noj-core/.deno_cache
          key: deno-${{ hashFiles('noj-core/deno.lock', 'noj-core/deno.json') }}
          restore-keys: |
            deno-

      - name: 运行单元测试 (deno test)
        working-directory: noj-core
        env:
          BCRYPT_SALT_ROUNDS: 4
        # 不设 DATABASE_URL → PGlite 内存模式，零外部 DB 依赖；
        # 单元测试暂不并行：Redis fail-closed 测试在并行下会互相干扰（已实测 flaky）。
        run: deno test -A --no-check --preload=tests/preload.ts tests/shared tests/data tests/app.test.ts src/domains/identity/tests/lib src/domains/catalog/tests/lib src/domains/identity/tests/middleware src/domains/query/tests/middleware src/domains/system/tests/middleware src/domains/catalog/tests/types src/domains/contest/tests/types src/domains/submission/tests/types

      - name: 上传失败日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-unit-logs
          path: |
            noj-core/test-logs/
            noj-core/test-output.log
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true

  # ===========================================================================
  # noj-core — 集成测试（需 PostgreSQL + Redis 服务容器）
  # ===========================================================================
  core-test-db:
    name: Core Test (DB)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noj
          POSTGRES_PASSWORD: noj
          POSTGRES_DB: noj
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379/
      # 真实接入 PostgreSQL 服务容器；若缺失则 00_migrate_test.ts 会静默退到 PGlite，
      # 导致 pg_trgm / tsvector / GIN 等 PG 专属路径在 PR 上从未被 CI 覆盖。
      DATABASE_URL: postgres://noj:noj@localhost:5432/noj
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NOJ_ENV: test
      DENO_DIR: ${{ github.workspace }}/noj-core/.deno_cache

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # 校验 JWT_SECRET 长度 ≥32（修复 finding S7）。
      # noj-core main.ts 启动时硬校验，但 CI 在测试环节会先 launch main.ts；
      # 把校验提前到 step 层，错误信息更精准。
      #
      # Fork / Dependabot PR 拿不到仓库 secrets，JWT_SECRET 为空——这是
      # GitHub 保护机制（不能给 untrusted code 跑涉及真 DB 的测试），
      # 视为预期情况优雅跳过（warning）而非 fail（error）。
      - name: Validate secrets
        id: validate-secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "::warning::JWT_SECRET 为空（fork / 第三方 PR），跳过 core-test-db"
            echo "::notice::本 job 需仓库 secrets，仅 trusted PR 跑全量 DB 测试"
            echo "SKIPPED_NO_SECRETS=true" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "${#JWT_SECRET}" -lt 32 ]; then
            echo "::error::JWT_SECRET must be ≥32 chars (got ${#JWT_SECRET})"
            exit 1
          fi

      - name: 缓存 Deno 依赖
        uses: actions/cache@v4
        with:
          # cache key 同时 hash deno.lock 和 deno.json（修复 finding P7）。
          # 原单 hashFiles('deno.lock') 在 imports map 变更时不刷新缓存，
          # 会用到旧的下载模块。
          path: ${{ github.workspace }}/noj-core/.deno_cache
          key: deno-${{ hashFiles('noj-core/deno.lock', 'noj-core/deno.json') }}
          restore-keys: |
            deno-

      - name: 运行测试 (deno test)
        # JWT_SECRET 缺失时由 validate-secrets step 设置 SKIPPED_NO_SECRETS=true，
        # 此处跳过整个测试步骤（已在 validate-secrets 阶段 warning 提示）。
        if: env.SKIPPED_NO_SECRETS != 'true'
        working-directory: noj-core
        env:
          BCRYPT_SALT_ROUNDS: 4
        # 不加 --parallel：多 worker 并发 TRUNCATE / INSERT 会导致死锁
        # （CI 日志可见 Process 494 vs 495 互锁）。串行执行匹配现有
        # resetDbForTest() 的顺序假设。此 job 只包含 DB 依赖子集，
        # 与 core-test-unit 并行互补。
        run: deno test -A tests/routes tests/db tests/00_migrate_test.ts tests/seed_bootstrap_admin_test.ts src/domains/identity/tests/routes src/domains/identity/tests/services src/domains/catalog/tests/routes src/domains/catalog/tests/services src/domains/submission/tests/routes src/domains/submission/tests/services src/domains/submission/tests/mq src/domains/query/tests/routes src/domains/query/tests/services src/domains/contest/tests/routes src/domains/contest/tests/services src/domains/community/tests/routes src/domains/community/tests/services src/domains/messaging/tests/routes src/domains/messaging/tests/services src/domains/objective/tests/routes src/domains/objective/tests/services src/domains/system/tests/routes src/domains/system/tests/services src/domains/gateway/tests/services src/domains/content-review/tests/services

      # 失败时上传日志（修复 finding M7）。CI 默认只在 UI 里保留日志，
      # 开发者必须本地复现才能排查；改为 actions/upload-artifact 上传到
      # GitHub Actions artifacts，contributor 可直接下载查看。
      - name: 上传失败日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-db-logs
          path: |
            noj-core/test-logs/
            noj-core/test-output.log
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true

  # ===========================================================================
  # noj-core — 性能基准（seed 100k problems，默认不跑）
  #
  # search_bench.test.ts 用 NOJ_RUN_PERF=1 guard；只在 main push 与手动
  # 触发时执行，PR 上跳过（避免每次 PR 插入 10 万行拖慢 CI）。
  # ===========================================================================
  core-perf:
    name: Core Perf (Benchmark)
    needs: changes
    # 仅 main push / workflow_dispatch；PR 一律跳过
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noj
          POSTGRES_PASSWORD: noj
          POSTGRES_DB: noj
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379/
      DATABASE_URL: postgres://noj:noj@localhost:5432/noj
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NOJ_RUN_PERF: "1"
      NOJ_PERF_ALLOW_EXTERNAL_DB: "1"
      DENO_DIR: ${{ github.workspace }}/noj-core/.deno_cache

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 缓存 Deno 依赖
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/noj-core/.deno_cache
          key: deno-${{ hashFiles('noj-core/deno.lock', 'noj-core/deno.json') }}
          restore-keys: |
            deno-

      # 修复 core-perf 失败：tests/perf 在 resetDbForTest() 里需要
      # 38 张表 + 种子数据已存在；未先跑 00_migrate_test.ts 时直接
      # 撞 "relation does not exist"（2026-08-06 main push 红 CI 根因）。
      - name: 运行性能基准 (NOJ_RUN_PERF=1)
        working-directory: noj-core
        env:
          BCRYPT_SALT_ROUNDS: 4
        run: deno test -A tests/00_migrate_test.ts tests/perf

  # ===========================================================================
  # noj-ui — Nuxt 4 前端（Deno 构建检查）
  # ===========================================================================
  ui-check:
    name: UI (Nuxt)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 缓存 node_modules
        uses: actions/cache@v4
        with:
          # cache key 同时 hash package.json 和 deno.lock（修复 finding P8）。
          # 原单 hashFiles('package.json') 在 lockfile 隐式更新时不刷缓存，
          # 会出现非确定性依赖版本。deno.lock 是本项目唯一的锁文件真源
          # （已移除冗余的 package-lock.json / pnpm-lock.yaml）。
          path: noj-ui/node_modules
          key: npm-${{ hashFiles('noj-ui/package.json', 'noj-ui/deno.lock') }}
          restore-keys: |
            npm-

      - name: 安装依赖 (Deno BYONM)
        working-directory: noj-ui
        run: deno install

      - name: 构建检查 (deno task build)
        working-directory: noj-ui
        run: deno task build

      - name: 单元测试 (deno task test)
        working-directory: noj-ui
        run: deno task test

      # 失败时上传 Nuxt 构建日志与 .output（修复 finding M7）
      - name: 上传失败日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ui-check-logs
          path: |
            noj-ui/.output/logs/
            noj-ui/.nuxt/dist/
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true

  # ===========================================================================
  # noj-judge — 格式 + Clippy + 单元测试（合并单 job）
  #
  # 性能优化：原 judge-fmt / judge-clippy / judge-test 三个独立 job 各自
  # 全量编译同一份 target，且 clippy/test 共用相同 cargo cache key 会互相
  # 覆盖。合并后 fmt → clippy → test 在同一 job 顺序执行，共享 target
  # 目录只编译一次；cache key 竞争随之消除。
  # 进一步加速（2026-07）：sccache 跨 job/跨 run 缓存编译产物，
  # cargo-nextest 并行执行多个 test binary。
  # ===========================================================================
  judge-check:
    name: Judge Check
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.judge == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # sccache 通过 GHA cache backend 读写编译缓存，需要 actions: write
    # （workflow 级默认只有 contents: read；fork PR 上 GitHub 自动降级为
    # 只读，sccache 写缓存失败仅警告，不影响测试正确性）
    permissions:
      actions: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 启用 sccache（Rust 编译缓存）
        uses: mozilla/sccache-action@v0.0.11
        with:
          cache-name: judge-sccache

      - name: 安装 cargo-nextest（并行测试运行器）
        uses: taiki-e/install-action@v2.87.0
        with:
          tool: cargo-nextest

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            noj-judge/target
          key: cargo-${{ hashFiles('noj-judge/Cargo.lock') }}
          restore-keys: |
            cargo-

      - name: 格式检查 (cargo fmt)
        working-directory: noj-judge
        run: cargo fmt --all --check

      - name: Clippy 检查 (cargo clippy)
        working-directory: noj-judge
        # 先编译（含测试目标），clippy 复用同一编译产物
        run: cargo clippy --all-targets -- -D warnings

      - name: 运行测试 (cargo nextest)
        working-directory: noj-judge
        # nextest 并行执行 lib/unit/integration 测试，比 cargo test 快；
        # 本项目无 doctest（src 无 /// ``` 示例），覆盖等价。
        run: cargo nextest run --all-targets

      # 失败时上传 cargo 编译缓存（修复 finding M7）
      - name: 上传失败日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: judge-check-logs
          path: noj-judge/target/
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true

  # ===========================================================================
  # noj-judge — Docker 沙箱集成测试
  #
  # 以前只跑在 workflow_dispatch，导致容器池 / 双容器协调 / 沙箱资源限制等
  # 关键路径在 push / PR 上无信号。现默认 push + 非 fork PR + manual 都跑。
  # Fork PR 仍会跑（GitHub-hosted ubuntu-latest 自带 Docker daemon），仅 cache 写入
  # 会被 GHA 静默忽略，缓存命中率下降但不影响测试正确性。
  # ===========================================================================
  judge-e2e:
    name: Judge E2E (Docker)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.judge == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOJ_RUN_E2E: "1"
    permissions:
      actions: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        # 注意：不装 rustfmt/clippy 组件——本 job 只编译并运行测试；
        # 曾因并行 cargo 触发 rustup sync 竞争导致 clippy 组件下载失败
        # （component download failed），组件越少失败面越小。
      - name: 启用 sccache（Rust 编译缓存）
        uses: mozilla/sccache-action@v0.0.11
        with:
          cache-name: judge-e2e-sccache

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            noj-judge/target
          key: cargo-e2e-${{ hashFiles('noj-judge/Cargo.lock') }}
          restore-keys: |
            cargo-e2e-

      - name: 构建测试 Docker 镜像
        working-directory: noj-judge/tests/e2e
        run: docker build -t noj-judge-test-runner -f Dockerfile.test-runner .

      - name: 运行 E2E 集成测试（2 组并行）
        working-directory: noj-judge
        env:
          # judge-e2e job 现在默认在 push/PR 上也跑（之前仅 workflow_dispatch）。
          # 此时仍需一个本地可达的 Redis，配合服务容器 redis:7-alpine。
          REDIS_URL: redis://localhost:6379/
        run: |
          # set -euo pipefail：任一 cargo test 失败立即终止整个 job
          set -euo pipefail
          # rustup 预热（修复 2026-08 并行竞争）：两个 run_group 同时启动
          # cargo 会各自触发 rustup channel sync + 组件下载，竞争同一
          # rustup 状态目录导致 "component download failed"（测试启动即死）。
          # 先单进程触发一次 sync，之后并行 cargo 不再下载。
          cargo --version >/dev/null
          # ci.yml 此处跑 5 个基础沙箱目标；dual_container / network_capability
          # 由 e2e.yml 的 judge-sandbox job 覆盖（共 7 个目标）。
          # 原 cargo test --test e2e 在没有 e2e.rs 的
          # 情况下 exit 101，从未暴露是因为 if: workflow_dispatch。
          # 性能优化（2026-07）：5 个目标分 2 组并行——组内串行
          # （serial_test 保证单 binary 内串行），组间并行利用 runner 多核；
          # 每组 3 个 Docker 沙箱并发为保守取值，避免资源竞争导致 flaky。
          run_group() {
            for target in "$@"; do
              echo "═══ $target ═══"
              NOJ_RUN_E2E=1 cargo test --test "$target" -- --ignored --test-threads=1
            done
          }
          run_group e2e_docker_basic e2e_resource_limits e2e_security_isolation &
          p1=$!
          run_group e2e_support_package e2e_problem_limits &
          p2=$!
          fail=0
          wait "$p1" || fail=1
          wait "$p2" || fail=1
          exit "$fail"

      # 失败时上传 Docker 沙箱产物
      - name: 上传失败日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: judge-e2e-logs
          path: |
            noj-judge/target/**/test-*.log
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true
