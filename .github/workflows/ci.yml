# =============================================================================
# Neuro OJ CI Pipeline
#
# 触发条件：main Push、Pull Request、手动触发、Release workflow_call
# 并行检查核心模块，PR 按真实变更路径过滤，main/手动/发布全量验证：
#   - root-gates:        仓库级静态门禁（含供应链 / 入口 Smoke / 配置读取点 / noj-tests 逻辑单测）
#   - core-quick-check:  noj-core fmt + lint + typecheck + logic 单测
#   - core-test-sharded: noj-core 隔离 PG/Redis 回归（全量 4 机并行；PR 单模块增量）
#   - ui-check:          noj-ui Nuxt 构建 + vue-tsc + 单测/覆盖率阈值 + 组件测试 + BFF/主题验收
#   - gateway-check:     noj-llm-gateway 静态检查 + 单测 + 覆盖率阈值
#   - production-cli:    noj-cli 静态检查 + 单测 + 真实 PG 往返 E2E（按路径过滤）
#   - judge-*:           Rust fmt/clippy + Python SDK 单测 + nextest + WASI 验收（单 job 并发）
# =============================================================================

name: CI

# workflow-level 最小权限：所有 job 默认 contents: read；如需写权限再按 job
# 单独收窄 scope。
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 候选发布（release.yml）在固定 SHA 上复用全量功能检查。workflow_call 下所有
  # job 的 `github.event_name != 'pull_request'` 分支为真，即全量执行。
  workflow_call:
    secrets:
      JWT_SECRET:
        required: false

# 仅 PR 上取消旧运行，main 推送必须跑完以保留完整质量门禁记录。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TEST_PG_ADMIN_URL: postgres://noj:noj@localhost:5432/postgres
  TEST_REDIS_URL: redis://localhost:6379/0
  TEST_STORAGE_ROOT: /tmp/noj-core-test-runs

jobs:
  # ===========================================================================
  # 变更检测（dorny/paths-filter + scripts/select-core-ci.ts）
  #
  # PR 上按改动路径过滤模块（排除纯 Markdown 文档）；push main / 手动 /
  # workflow_call 始终全量执行。
  # ===========================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      core-full: ${{ steps.selection.outputs.core-full }}
      core-run: ${{ steps.selection.outputs.core-run }}
      core-shards: ${{ steps.selection.outputs.core-shards }}
      core-modules: ${{ steps.selection.outputs.core-modules }}
      core-modules-csv: ${{ steps.selection.outputs.core-modules-csv }}
      core-reasons: ${{ steps.selection.outputs.core-reasons }}
      e2e-domains: ${{ steps.selection.outputs.e2e-domains }}
      e2e-browser: ${{ steps.selection.outputs.e2e-browser }}
      ui: ${{ steps.filter.outputs.ui }}
      judge: ${{ steps.filter.outputs.judge }}
      wasi: ${{ steps.filter.outputs.wasi }}
      gateway: ${{ steps.filter.outputs.gateway }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # paths-filter 与选择器需要比较 base/head 历史
          fetch-depth: 0

      - name: 按模块路径过滤
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          # 注意：paths-filter 默认 predicate-quantifier 为 some（OR 语义），
          # 不能把 '!**/*.md' 作为独立条目写入列表；使用 picomatch 内联 extglob
          # '/**/!(*.md)' 仅在对应目录内排除 Markdown 文档。
          filters: |
            core:
              - 'noj-core/**/!(*.md)'
              - 'dev-docs/engineering/module-boundaries.json'
              - 'scripts/**/!(*.md)'
              - 'docker-compose.e2e.yml'
              - 'env.e2e.template'
              - '.github/workflows/ci.yml'
            ui:
              - 'noj-ui/**/!(*.md)'
              - '.github/workflows/ci.yml'
            judge:
              - 'noj-judge/**/!(*.md)'
              - 'docker-compose.e2e.yml'
              - 'env.e2e.template'
              - '.github/workflows/ci.yml'
            wasi:
              - 'noj-judge/src/**/!(*.md)'
              - 'noj-judge/Cargo.toml'
              - 'noj-judge/Cargo.lock'
              - 'noj-judge/toolchain/**/!(*.md)'
              - 'noj-judge/examples/**/!(*.md)'
              - 'noj-judge/scripts/*wasi*'
              - 'noj-judge/Dockerfile'
              - 'fixtures/noj-wasm-*.json'
              - '.github/workflows/ci.yml'
            gateway:
              - 'noj-llm-gateway/**/!(*.md)'
              - 'noj-tests/fixtures/**/!(*.md)'
              - 'scripts/**/!(*.md)'
              - 'docker-compose.e2e.yml'
              - 'env.e2e.template'
              - '.github/workflows/ci.yml'
            cli:
              - 'noj-cli/**/!(*.md)'
              - 'docker-compose.prod.yml'
              - 'deploy/**/!(*.md)'
              - 'scripts/deploy/**/!(*.md)'
              - '.github/workflows/ci.yml'

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc

      - name: 计算受影响测试范围
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_REF: ${{ github.ref }}
        run: |
          args=(--event "${EVENT_NAME}" --ref "${GIT_REF}")
          if [ -n "${BASE_SHA}" ] && [ -n "${HEAD_SHA}" ]; then
            args+=(--base "${BASE_SHA}" --head "${HEAD_SHA}")
          fi
          deno run --allow-read --allow-env --allow-write --allow-run=git \
            scripts/select-core-ci.ts "${args[@]}"

  # ===========================================================================
  # 仓库级静态门禁（合并原 root-gates / supply-chain / entrypoint-smoke /
  # config-usage-check，消除 3 台秒级静态检查 VM 的重复冷启动开销）
  # ===========================================================================
  root-gates:
    name: Root Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 安装 Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc

      - name: 检查供应链约束
        run: bash scripts/release/test-supply-chain.sh

      - name: 入口 Smoke
        run: deno run -A scripts/smoke-entrypoints.ts

      - name: 验证 WASM 统一标准
        run: deno run -A scripts/verify-wasm-standard.ts

      - name: 配置读取点静态校验 (check:config-usage)
        working-directory: noj-core
        run: deno task check:config-usage

      - name: 仓库级门禁
        run: deno run -A scripts/check-ci.ts

      - name: noj-tests 零依赖单测
        working-directory: noj-tests
        run: deno task test:logic

  # ===========================================================================
  # noj-cli — 静态检查 + 单测 + 真实 PostgreSQL 往返 E2E（按 cli 路径过滤）
  #
  # 合并原 production-cli 与 production-cli-e2e：同一 runner 跑完检查、单测与
  # 真实 pg_dump/pg_restore/gpg/zstd 往返，消除无条件运行与重复环境搭建。
  # ===========================================================================
  production-cli:
    name: Production CLI
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOJ_E2E_PG_CONTAINER: noj-e2e-postgres
      NOJ_E2E_PG_USER: noj
      NOJ_E2E_PG_PASSWORD: noj
      NOJ_E2E_PG_DB: noj
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noj
          POSTGRES_PASSWORD: noj
          POSTGRES_DB: noj
        ports:
          - 5432:5432
        options: >-
          --name noj-e2e-postgres
          --health-cmd "pg_isready -U noj"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
      - name: 确认 E2E 依赖容器与工具链就绪
        run: |
          set -euo pipefail
          docker inspect noj-e2e-postgres >/dev/null || {
            echo "::error::service container noj-e2e-postgres 未就绪"; exit 1; }
          gpg --version >/dev/null
          tar --version >/dev/null
          zstd --version >/dev/null
      - name: 检查 CLI、单测与真实 PostgreSQL 往返 E2E
        working-directory: noj-cli
        run: |
          set -euo pipefail
          deno task check
          # deno task test 已包含 src/prod/ 单测；随后开启 NOJ_RUN_E2E 跑真实往返 E2E。
          deno task test
          NOJ_RUN_E2E=1 deno test -A src/prod/e2e/

  # ===========================================================================
  # noj-core — 快速静态检查（fmt + lint + typecheck + 零依赖逻辑测试）
  # ===========================================================================
  core-quick-check:
    name: Core Quick Check
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DENO_DIR: ${{ github.workspace }}/noj-core/.deno_cache

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 安装 Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc

      - name: 缓存 Deno 依赖
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/noj-core/.deno_cache
          key: deno-quick-${{ hashFiles('noj-core/deno.lock', 'noj-core/deno.json') }}
          restore-keys: |
            deno-quick-

      - name: 格式检查 (deno fmt --check)
        working-directory: noj-core
        run: deno fmt --check

      - name: 代码检查 (deno lint)
        working-directory: noj-core
        run: deno lint

      - name: 类型检查 (deno check)
        working-directory: noj-core
        run: find src -name '*.ts' -print0 | xargs -0 deno check

      - name: 纯逻辑与测试入口契约
        working-directory: noj-core
        run: deno task test:logic

  # ===========================================================================
  # noj-llm-gateway — 静态检查 + 单元测试 + 覆盖率阈值门禁（≥54%）
  #
  # 直接在单测执行时采集覆盖率并检验阈值，避免单独的 coverage-check 重复
  # 启动 PG/Redis 并冷跑整套测试。
  # ===========================================================================
  gateway-check:
    name: Gateway Check
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.gateway == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DENO_DIR: ${{ github.workspace }}/noj-llm-gateway/.deno_cache
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noj
          POSTGRES_PASSWORD: noj
          POSTGRES_DB: noj_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noj -d noj_gateway_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 安装 Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc

      - name: 缓存 Deno 依赖
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            noj-llm-gateway/.deno_cache
          key: gateway-deno-${{ hashFiles('noj-llm-gateway/deno.lock', 'noj-llm-gateway/deno.json') }}
          restore-keys: |
            gateway-deno-

      - name: 格式检查 (deno fmt)
        working-directory: noj-llm-gateway
        run: deno fmt --check

      - name: Lint (deno lint)
        working-directory: noj-llm-gateway
        run: deno lint

      - name: 类型检查 (deno check)
        working-directory: noj-llm-gateway
        run: deno check src/mod.ts

      - name: 单元测试与覆盖率门禁 (≥54%)
        working-directory: noj-llm-gateway
        env:
          TEST_PG_ADMIN_URL: postgres://noj:noj@localhost:5432/postgres
          TEST_REDIS_URL: redis://localhost:6379/15
        run: deno task test:coverage

  # ===========================================================================
  # noj-core — 分片并行测试（真实 PostgreSQL 模板路径）
  #
  # - main push / 手动触发 / core-full 变更：4 台 runner 并行跑 4 片（每台 1 片，
  #   不再单机两波串行），总墙钟从 6–7 分钟降到 ~2.5 分钟；
  # - PR 仅触及特定模块：单台 runner 仅跑受影响模块及其反向依赖闭包（由
  #   scripts/select-core-ci.ts 计算），保持隔离数据库与迁移验证。
  # ===========================================================================
  core-test-sharded:
    name: Core Sharded (${{ matrix.shard }})
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core-run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.changes.outputs.core-shards) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noj
          POSTGRES_PASSWORD: noj
          POSTGRES_DB: noj
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/
      DATABASE_URL: postgres://noj:noj@localhost:5432/noj
      NOJ_ENV: test
      DENO_DIR: ${{ github.workspace }}/noj-core/.deno_cache
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 安装 Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc

      - name: Inject or validate JWT_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -n "$JWT_SECRET" ]; then
            if [ "${#JWT_SECRET}" -lt 32 ]; then
              echo "::error::JWT_SECRET must be ≥32 chars (got ${#JWT_SECRET})"
              exit 1
            fi
          else
            JWT_SECRET="$(openssl rand -hex 32)"
          fi
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"

      - name: 缓存 Deno 依赖
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/noj-core/.deno_cache
          key: deno-sharded-${{ hashFiles('noj-core/deno.lock', 'noj-core/deno.json') }}
          restore-keys: |
            deno-sharded-

      - name: 分片测试（独立数据库）
        working-directory: noj-core
        env:
          BCRYPT_SALT_ROUNDS: "4"
          CORE_FULL: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core-full == 'true' }}
          CORE_MODULES_CSV: ${{ needs.changes.outputs.core-modules-csv }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [ "$CORE_FULL" = "true" ] || [ -z "$CORE_MODULES_CSV" ]; then
            deno task test:parallel --shards 4 --jobs 1 --shard-index "$SHARD_INDEX"
          else
            deno task test:parallel --shards 1 --jobs 1 --modules "$CORE_MODULES_CSV"
          fi

      - name: 记录分片选择
        if: always()
        run: |
          {
            echo "### Core Sharded (${{ matrix.shard }}) 选择结果"
            echo ""
            echo "- 全量 Core：${{ needs.changes.outputs.core-full }}"
            echo "- 受影响模块：${{ needs.changes.outputs.core-modules }}"
            echo "- 选择理由：${{ needs.changes.outputs.core-reasons }}"
            echo "- 分片计划：noj-core/.test-cache/performance/<runId>/shard-plan.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传失败日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-test-sharded-logs-${{ matrix.shard }}
          path: |
            noj-core/test-logs/
            noj-core/test-output.log
            noj-core/.test-cache/performance/
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true

  # ===========================================================================
  # noj-ui — Nuxt 4 前端（类型 + 组件测试 + 构建 + 单测覆盖率 + BFF/主题验收）
  #
  # 合并原 ui-components 与 coverage-check 的 noj-ui 覆盖率门禁，并缓存
  # Playwright 浏览器，避免重复 nuxt typecheck 与重复下载 Chromium。
  # ===========================================================================
  ui-check:
    name: UI (Nuxt)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DENO_DIR: ${{ github.workspace }}/noj-ui/.deno_cache

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 安装 Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc

      - name: 缓存 node_modules 与 Deno 依赖
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            noj-ui/node_modules
            noj-ui/.deno_cache
          key: npm-ui-${{ hashFiles('noj-ui/package.json', 'noj-ui/deno.lock') }}
          restore-keys: |
            npm-ui-

      - name: 安装依赖 (Deno BYONM)
        working-directory: noj-ui
        run: deno install

      - name: 全页面类型检查 (nuxt typecheck 生成 + vue-tsc)
        working-directory: noj-ui
        run: deno task check:types:nuxt

      - name: 组件测试 (Vitest)
        working-directory: noj-ui
        run: deno task test:components

      - name: 构建检查 (deno task build)
        working-directory: noj-ui
        run: deno task build

      - name: 单元测试与覆盖率门禁 (≥60%)
        working-directory: noj-ui
        run: deno task test:coverage

      - name: 缓存 Playwright 浏览器
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ui-${{ hashFiles('noj-ui/deno.lock') }}
          restore-keys: |
            playwright-ui-

      - name: 安装 BFF 浏览器验收依赖
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: noj-ui
        run: deno run -A npm:playwright@1.65.1 install --with-deps chromium

      - name: BFF 生产 SSR 与水合验收
        working-directory: noj-ui
        run: deno task test:bff:ssr

      - name: BFF 跨副本缓存与故障降级
        working-directory: noj-ui
        env:
          BFF_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: deno task test:bff:cache

      - name: 编辑器 Markdown 明暗主题回归
        working-directory: noj-ui
        env:
          E2E_UI_URL: http://127.0.0.1:3064
          NOJ_THEME_SCREENSHOTS: test-results/theme
        run: |
          PORT=3064 HOST=127.0.0.1 deno run -A .output/server/index.mjs > theme-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$E2E_UI_URL/editor/P22" > /dev/null; then
              break
            fi
            sleep 1
          done
          deno task test:theme

      - name: 上传失败日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-check-logs
          path: |
            noj-ui/.output/logs/
            noj-ui/.nuxt/dist/
            noj-ui/test-results/theme/
            noj-ui/theme-server.log
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true

  # ===========================================================================
  # noj-judge — 并行作业
  #
  #   judge-check          fmt + clippy + Python SDK 单测
  #   judge-test           nextest（Rust 全量单元/集成）
  #   judge-wasi-sdk       固定 NOJ WASI SDK（按输入哈希缓存，命中即跳过构建）
  #   judge-wasi-acceptance 单 job 一次编译 + 4 组并发运行（消除 4×90s 重复编译）
  #   judge-wasi-image     生产 runtime 镜像验收（输入未变即缓存命中跳过）
  # ===========================================================================
  judge-check:
    name: Judge Check
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.judge == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write

    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: 启用 sccache（Rust 编译缓存）
        uses: mozilla/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: 缓存 Cargo 注册表
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('noj-judge/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: 格式检查 (cargo fmt)
        working-directory: noj-judge
        run: cargo fmt --all --check

      - name: Clippy 检查 (cargo clippy)
        working-directory: noj-judge
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: 安装 Python（SDK 单测）
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Evaluator SDK 单测 (unittest)
        working-directory: noj-judge/sdk/evaluator
        env:
          PYTHONPATH: .:../common
        run: |
          mods=()
          for f in noj_evaluator_sdk/tests/test_*.py; do
            m="${f%.py}"
            mods+=("${m//\//.}")
          done
          timeout 300 python -m unittest -v "${mods[@]}"

      - name: Solution SDK 单测 (unittest)
        working-directory: noj-judge/sdk/solution
        env:
          PYTHONPATH: .:../common
        run: |
          mods=()
          for f in noj_solution_sdk/tests/test_*.py; do
            m="${f%.py}"
            mods+=("${m//\//.}")
          done
          timeout 300 python -m unittest -v "${mods[@]}"

  judge-test:
    name: Judge Tests
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.judge == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - name: 启用 sccache（Rust 编译缓存）
        uses: mozilla/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: 安装 cargo-nextest（并行测试运行器）
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest
      - name: 缓存 Cargo 注册表
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('noj-judge/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: 运行测试 (cargo nextest)
        working-directory: noj-judge
        run: cargo nextest run --locked --all-targets

  judge-wasi-sdk:
    name: Judge WASI SDK
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.wasi == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 校验固定来源下载保护
        working-directory: noj-judge
        run: python3 -m unittest discover -s scripts -p test_build_oi_wasi_toolchain.py

      - name: 恢复已构建 WASI SDK
        id: sdk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/noj-wasi-sdk-a
          key: noj-wasi-sdk-v1-${{ hashFiles('noj-judge/toolchain/recipe.json', 'noj-judge/toolchain/archive-encodings.json', 'noj-judge/toolchain/patches/*.patch', 'noj-judge/scripts/build-oi-wasi-toolchain.*') }}

      - name: 缓存固定 WASI 构建来源
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/noj-wasi-cache
          key: noj-wasi-v2-${{ hashFiles('noj-judge/toolchain/recipe.json', 'noj-judge/toolchain/archive-encodings.json', 'noj-judge/toolchain/patches/*.patch', 'noj-judge/scripts/build-oi-wasi-toolchain.*') }}

      - name: 构建并验证固定 NOJ WASI SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: noj-judge
        run: >-
          bash scripts/build-oi-wasi-toolchain.sh
          "${RUNNER_TEMP}/noj-wasi-cache"
          "${RUNNER_TEMP}/noj-wasi-build-a"
          "${RUNNER_TEMP}/noj-wasi-sdk-a"

      - name: 不同目录构建产物一致性
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: noj-judge
        run: >-
          bash scripts/build-oi-wasi-toolchain.sh
          "${RUNNER_TEMP}/noj-wasi-cache"
          "${RUNNER_TEMP}/noj-wasi-build-b"
          "${RUNNER_TEMP}/noj-wasi-sdk-b"

  judge-wasi-acceptance:
    name: Judge WASI Acceptance
    needs: [changes, judge-wasi-sdk]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.wasi == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      NOJ_WASI_OPT_DEPS: "1"
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: 启用 sccache（Rust 编译缓存）
        uses: mozilla/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: 缓存 Cargo 注册表
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('noj-judge/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: 获取已构建 WASI SDK
        id: sdk-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/noj-wasi-sdk-a
          key: noj-wasi-sdk-v1-${{ hashFiles('noj-judge/toolchain/recipe.json', 'noj-judge/toolchain/archive-encodings.json', 'noj-judge/toolchain/patches/*.patch', 'noj-judge/scripts/build-oi-wasi-toolchain.*') }}
          fail-on-cache-miss: true

      - name: 真实 WASI C/C++ 评测验收（一次编译 + 4 组并发）
        working-directory: noj-judge
        shell: bash
        run: >-
          bash scripts/check-oi-wasi-toolchain.sh "${RUNNER_TEMP}/noj-wasi-sdk-a" all
          2>&1 | tee "${RUNNER_TEMP}/noj-wasi-toolchain-check.log"

      - name: 上传失败日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: judge-wasi-acceptance-logs
          path: ${{ runner.temp }}/noj-wasi-*-check.log
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true

  judge-wasi-image:
    name: Judge WASI Image
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.wasi == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 检查镜像验收标记
        id: image-ok
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/noj-wasi-image-ok
          key: noj-wasi-image-v1-${{ hashFiles('noj-judge/Dockerfile', 'noj-judge/toolchain/recipe.json', 'noj-judge/toolchain/archive-encodings.json', 'noj-judge/toolchain/patches/*.patch', 'noj-judge/scripts/build-oi-wasi-toolchain.py', 'noj-judge/scripts/check-oi-wasi-image.sh') }}

      - name: 生产 WASI runtime 镜像验收
        if: steps.image-ok.outputs.cache-hit != 'true'
        working-directory: noj-judge
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check-oi-wasi-image.sh 2>&1 | tee "${RUNNER_TEMP}/noj-wasi-image-check.log"
          mkdir -p "${RUNNER_TEMP}/noj-wasi-image-ok"
          date -u > "${RUNNER_TEMP}/noj-wasi-image-ok/ok"

      - name: 上传失败日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: judge-wasi-image-logs
          path: ${{ runner.temp }}/noj-wasi-*-check.log
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true
