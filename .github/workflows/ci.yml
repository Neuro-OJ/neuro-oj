  # ===========================================================================
  # noj-core — 分片并行测试（TEST_SCHEMA 路径）
  #
  # 背景（2026-09-11 评审补充）：D0 修复的是「分片模式下迁移的跨 schema 硬编码
  # 前缀」导致的一类失败，而**这条路径此前没有任何 CI 覆盖**——CI 各域作业走
  # `test-domain.sh <domain>`（单 schema、无 TEST_SCHEMA），因此该缺陷在 CI
  # 中完全不可见，回归也不会被发现。本作业补上这条路径。
  #
  # 只跑 `--shards 1`（unit 分片）：它足以覆盖迁移 + TEST_SCHEMA + 跨 schema FK
  # 解析这条链路，代价远低于跑满两个分片。db 分片由各 Core <domain> 作业覆盖
  # 同等业务面的单 schema 版本。
  #
  # 注意：test-parallel.ts 会先校验分片 schema 的迁移状态，陈旧 schema 会以
  # 明确指引失败（而不是让测试报出难归因的 FK 错误）。
  # ===========================================================================
  core-test-sharded:
    name: Core Sharded (TEST_SCHEMA)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noj
          POSTGRES_PASSWORD: noj
          POSTGRES_DB: noj
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/
      DATABASE_URL: postgres://noj:noj@localhost:5432/noj
      NOJ_ENV: test
      JWT_SECRET: e2e-ci-secret-fixed-value-with-32-chars-min-abc
      DENO_DIR: ${{ github.workspace }}/noj-core/.deno_cache
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 缓存 Deno 依赖
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/noj-core/.deno_cache
          key: deno-sharded-${{ hashFiles('noj-core/deno.lock', 'noj-core/deno.json') }}
          restore-keys: |
            deno-sharded-

      # 不传 --env-file：CI 通过 job env 提供全部变量，避免依赖仓库内不存在的 .env
      - name: 分片测试（TEST_SCHEMA=test_unit）
        working-directory: noj-core
        env:
          BCRYPT_SALT_ROUNDS: "4"
        run: deno run -A scripts/test-parallel.ts --shards 1

      - name: 上传失败日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-sharded-logs
          path: |
            noj-core/test-logs/
            noj-core/test-output.log
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true

  # ===========================================================================
  # noj-core — 性能基准（seed 100k problems，默认不跑）
  #
  # search_bench.test.ts 用 NOJ_RUN_PERF=1 guard；只在 main push 与手动
  # 触发时执行，PR 上跳过（避免每次 PR 插入 10 万行拖慢 CI）。
  # ===========================================================================
  core-perf:
    name: Core Perf (Benchmark)
    needs: changes
    # 仅 main push / workflow_dispatch；PR 一律跳过
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noj
          POSTGRES_PASSWORD: noj
          POSTGRES_DB: noj
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379/
      DATABASE_URL: postgres://noj:noj@localhost:5432/noj
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NOJ_RUN_PERF: "1"
      NOJ_PERF_ALLOW_EXTERNAL_DB: "1"
      DENO_DIR: ${{ github.workspace }}/noj-core/.deno_cache

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 缓存 Deno 依赖
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/noj-core/.deno_cache
          key: deno-${{ hashFiles('noj-core/deno.lock', 'noj-core/deno.json') }}
          restore-keys: |
            deno-

      # 修复 core-perf 失败：tests/perf 在 resetDbForTest() 里需要
      # 38 张表 + 种子数据已存在；未先跑 00_migrate_test.ts 时直接
      # 撞 "relation does not exist"（2026-08-06 main push 红 CI 根因）。
      - name: 运行性能基准 (NOJ_RUN_PERF=1)
        working-directory: noj-core
        env:
          BCRYPT_SALT_ROUNDS: 4
        run: deno test -A tests/00_migrate_test.ts tests/perf src/domains/search/tests/perf

  # ===========================================================================
  # noj-ui — Nuxt 4 前端（Deno 构建检查）
  # ===========================================================================
  ui-check:
    name: UI (Nuxt)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 缓存 node_modules
        uses: actions/cache@v4
        with:
          # cache key 同时 hash package.json 和 deno.lock（修复 finding P8）。
          # 原单 hashFiles('package.json') 在 lockfile 隐式更新时不刷缓存，
          # 会出现非确定性依赖版本。deno.lock 是本项目唯一的锁文件真源
          # （已移除冗余的 package-lock.json / pnpm-lock.yaml）。
          path: noj-ui/node_modules
          key: npm-${{ hashFiles('noj-ui/package.json', 'noj-ui/deno.lock') }}
          restore-keys: |
            npm-

      - name: 安装依赖 (Deno BYONM)
        working-directory: noj-ui
        run: deno install

      # 全页面类型检查（issue #427）：`nuxt typecheck` 生成 .nuxt 类型上下文后
      # 运行显式 vue-tsc，覆盖 pages / components / composables / middleware /
      # server 的适用类型上下文。能拒绝 deno check 覆盖不到的 SFC 内错误
      #（如注册页曾出现过的未定义变量 sent）。
      # 注意：不能换成 `nuxt prepare`（Deno 下其类型生成静默缺失，.nuxt/tsconfig.json
      # 不会生成）；也不能只用 `nuxt typecheck`（其内部启动的 vue-tsc 在 Deno 下
      # 会静默跳过），故拆为「生成类型 + 显式 vue-tsc」两步。
      - name: 全页面类型检查 (nuxt typecheck 生成 + vue-tsc)
        working-directory: noj-ui
        run: deno task check:types:nuxt

      - name: 构建检查 (deno task build)
        working-directory: noj-ui
        run: deno task build

      - name: 单元测试 (deno task test)
        working-directory: noj-ui
        run: deno task test

      # 失败时上传 Nuxt 构建日志与 .output（修复 finding M7）
      - name: 上传失败日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ui-check-logs
          path: |
            noj-ui/.output/logs/
            noj-ui/.nuxt/dist/
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true

  ui-components:
    name: UI Components
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: 缓存 node_modules
        uses: actions/cache@v4
        with:
          path: noj-ui/node_modules
          key: npm-${{ hashFiles('noj-ui/package.json', 'noj-ui/deno.lock') }}
          restore-keys: |
            npm-
      - name: 安装依赖 (Deno BYONM)
        working-directory: noj-ui
        run: deno install
      - name: 生成 Nuxt 类型上下文
        working-directory: noj-ui
        run: deno run -A npm:nuxt typecheck
      - name: 组件测试
        working-directory: noj-ui
        run: deno task test:components

  # ===========================================================================
  # noj-judge — 格式 + Clippy + 单元测试（合并单 job）
  #
  # 性能优化：原 judge-fmt / judge-clippy / judge-test 三个独立 job 各自
  # 全量编译同一份 target，且 clippy/test 共用相同 cargo cache key 会互相
  # 覆盖。合并后 fmt → clippy → test 在同一 job 顺序执行，共享 target
  # 目录只编译一次；cache key 竞争随之消除。
  # 进一步加速（2026-07）：sccache 跨 job/跨 run 缓存编译产物，
  # cargo-nextest 并行执行多个 test binary。
  # ===========================================================================
  judge-check:
    name: Judge Check
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.judge == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # sccache 通过 GHA cache backend 读写编译缓存，需要 actions: write
    # （workflow 级默认只有 contents: read；fork PR 上 GitHub 自动降级为
    # 只读，sccache 写缓存失败仅警告，不影响测试正确性）
    permissions:
      actions: write

    # Redis：per-user claim 的集成测试（tests/user_claim_redis.rs）需要真实 Redis。
    # 此前该作业没有 Redis，那些用例会走「未设置 REDIS_URL → 直接 return」的分支，
    # 被 nextest 记为 **passed** 却什么都没验证——PR 里最关键的并发回归证据
    # （8 个 worker 争抢同一用户，恰好 1 个成功）因此在 CI 中形同虚设。
    # 提供 Redis 后它们在每次 CI 都真实执行。
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 启用 sccache（Rust 编译缓存）
        uses: mozilla/sccache-action@v0.0.11
        # 同上：必须显式设置 RUSTC_WRAPPER / SCCACHE_GHA_ENABLED 才会生效。
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"

      - name: 安装 cargo-nextest（并行测试运行器）
        uses: taiki-e/install-action@v2.87.0
        with:
          tool: cargo-nextest

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            noj-judge/target
          key: cargo-${{ hashFiles('noj-judge/Cargo.lock') }}
          restore-keys: |
            cargo-

      - name: 格式检查 (cargo fmt)
        working-directory: noj-judge
        run: cargo fmt --all --check

      - name: Clippy 检查 (cargo clippy)
        working-directory: noj-judge
        # 先编译（含测试目标），clippy 复用同一编译产物
        run: cargo clippy --all-targets -- -D warnings

      - name: 运行测试 (cargo nextest)
        working-directory: noj-judge
        # nextest 并行执行 lib/unit/integration 测试，比 cargo test 快；
        # 本项目无 doctest（src 无 /// ``` 示例），覆盖等价。
        run: cargo nextest run --all-targets

      # 失败时上传 cargo 编译缓存（修复 finding M7）
      - name: 上传失败日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: judge-check-logs
          path: noj-judge/target/
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true
