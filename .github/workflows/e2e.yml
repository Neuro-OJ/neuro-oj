# =============================================================================
# Neuro OJ — 全链路 E2E 测试
#
# 在每个 PR 和推送到 main 时运行完整的端到端测试：
#   - e2e-full：noj-tests 全量 E2E（30 个测试文件 / 204 个 e2eTest 用例）
#   - judge-sandbox：noj-judge Docker 沙箱 E2E（7 个 binary，独立 job）
#
# 使用 Docker Compose 编排完整评测栈（noj-core + noj-judge + PostgreSQL + Redis）。
#
# 技术栈：Deno + Rust + Docker Compose
# 运行时间：首次 ~15min，缓存命中后 ~5-8min
#
# 性能优化（2026-07）：
#   - judge 沙箱 E2E 拆为独立 job（它只依赖 Docker + Redis，测试内自建
#     评测镜像 ensure_test_image，无需 noj-core 栈），与 API E2E 并行，
#     总时长从串行 ~15min 降到 max(API, sandbox) ~8min
#   - noj-tests 30 个文件分 3 组并行（组间独立进程；文件间无跨文件固定
#     ID 依赖，admin 改密竞态由 helper.ts loginAndChangePassword 并发
#     兜底处理）
#   - judge-sandbox 复用 sccache 编译缓存 + 7 个 binary 分 3 组并行
# =============================================================================

name: E2E

# workflow-level 最小权限：所有 job 默认 contents: read。修复 finding S3。
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    # 纯文档 / 规范 / lint 配置类改动无需跑完整评测栈（节省 10-15 min / PR）。
    # push to main 仍全量跑；workflow_dispatch 仍可手动强跑。
    # 修复点：之前的 cache-to mode=min 拆分到独立的 workflow 安全与配置一致性 PR。
    # issue #427：noj-ui 改动现在会触发本 workflow —— UI 浏览器关键流程门禁
    # （注册验证 / 登录退出 / 代码提交到结果 / 核心失败反馈）依赖完整评测栈；
    # ci.yml 自身改动仍不触发（ci.yml 不涉及评测栈镜像/编排）。
    paths-ignore:
      - 'dev-docs/**'
      - 'noj-docs/**'
      - '**/*.md'
      - 'docker-compose.yml'
      - 'LICENSE'
      - 'scripts/db/**'
      - '.github/dependabot.yml'
      - '.github/actionlint.yaml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# 仅 PR 上可取消旧运行（修复 finding M4），main 推送不可被取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_PROJECT_NAME: noj-e2e
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  E2E_BASE_URL: http://localhost:8099
  E2E_CORE_PORT: 8099
  E2E_DB_URL: postgres://e2e:e2e@localhost:5433/e2e
  E2E_REDIS_URL: redis://localhost:6380/1
  # JWT_SECRET 单一来源（修复 finding S1）。
  # 全仓库（e2e.yml workflow env、docker-compose.e2e.yml noj-core、env.e2e.template）
  # 统一使用此值；任何一处修改必须同步另外两处。
  # 长度 ≥32 满足 noj-core main.ts 的 JWT_SECRET ≥ 32 字符校验。
  JWT_SECRET: e2e-ci-secret-fixed-value-with-32-chars-min-abc
  # TFA_ENCRYPTION_KEY 单一来源，与 docker-compose.e2e.yml / env.e2e.template 保持一致。
  TFA_ENCRYPTION_KEY: e2e-ci-tfa-encryption-key-with-32-chars-min-abc
  NOJ_RUN_E2E: "1"
  BCRYPT_SALT_ROUNDS: 4
  DENO_DIR: ${{ github.workspace }}/noj-core/.deno_cache

jobs:
  changes:
    name: Detect E2E Domains
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      e2e-domains: ${{ steps.domains.outputs.e2e-domains }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 按 Domain 路径过滤
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            e2e-identity:
              - 'noj-tests/e2e/identity/**'
              - 'noj-core/src/domains/identity/**'
            e2e-catalog:
              - 'noj-tests/e2e/catalog/**'
              - 'noj-core/src/domains/catalog/**'
            e2e-submission:
              - 'noj-tests/e2e/submission/**'
              - 'noj-core/src/domains/submission/**'
            e2e-contest:
              - 'noj-tests/e2e/contest/**'
              - 'noj-core/src/domains/contest/**'
            e2e-system:
              - 'noj-tests/e2e/system/**'
              - 'noj-core/src/domains/system/**'
            e2e-community:
              - 'noj-tests/e2e/community/**'
              - 'noj-core/src/domains/community/**'
            e2e-messaging:
              - 'noj-tests/e2e/messaging/**'
              - 'noj-core/src/domains/messaging/**'
            e2e-objective:
              - 'noj-tests/e2e/objective/**'
              - 'noj-core/src/domains/objective/**'
            e2e-admin:
              - 'noj-tests/e2e/admin/**'
              - 'noj-core/src/domains/admin/**'
            e2e-cross-domain:
              - 'noj-tests/e2e/cross-domain/**'
            e2e-browser:
              - 'noj-tests/e2e/browser/**'
              - 'noj-ui/**'
            e2e-infra:
              - 'noj-core/src/shared/**'
              - 'noj-core/src/routes/**'
              - 'noj-core/src/app.ts'
              - 'noj-core/src/main.ts'
              - 'noj-core/src/mod.ts'
              - 'noj-core/drizzle/**'
              - 'noj-core/tests/**'
              - 'noj-judge/**'
              - 'noj-llm-gateway/**'
              - 'docker-compose.e2e.yml'
              - 'env.e2e.template'
              - 'scripts/**'
              - 'noj-tests/scripts/**'
              - 'noj-tests/deno.json'
              - '.github/actions/e2e-domain/**'
              - '.github/workflows/e2e.yml'
      - name: 计算受影响 e2e-domains
        id: domains
        env:
          E2E_IDENTITY: ${{ steps.filter.outputs.e2e-identity }}
          E2E_CATALOG: ${{ steps.filter.outputs.e2e-catalog }}
          E2E_SUBMISSION: ${{ steps.filter.outputs.e2e-submission }}
          E2E_CONTEST: ${{ steps.filter.outputs.e2e-contest }}
          E2E_SYSTEM: ${{ steps.filter.outputs.e2e-system }}
          E2E_COMMUNITY: ${{ steps.filter.outputs.e2e-community }}
          E2E_MESSAGING: ${{ steps.filter.outputs.e2e-messaging }}
          E2E_OBJECTIVE: ${{ steps.filter.outputs.e2e-objective }}
          E2E_ADMIN: ${{ steps.filter.outputs.e2e-admin }}
          E2E_CROSS_DOMAIN: ${{ steps.filter.outputs.e2e-cross-domain }}
          E2E_BROWSER: ${{ steps.filter.outputs.e2e-browser }}
          E2E_INFRA: ${{ steps.filter.outputs.e2e-infra }}
        run: |
          python3 - <<'PY'
          import json, os
          def flag(name):
              return os.environ.get(name, '') == 'true'
          all_e2e = ["identity","catalog","submission","contest","system","community","messaging","objective","admin"]
          e2e_domains = []
          if flag('E2E_INFRA'):
              e2e_domains = all_e2e[:]
          else:
              for d in all_e2e:
                  if flag(f'E2E_{d.upper().replace("-", "_")}'):
                      e2e_domains.append(d)
          if flag('E2E_CROSS_DOMAIN') or flag('E2E_INFRA'):
              e2e_domains.append('cross-domain')
          if flag('E2E_BROWSER') or flag('E2E_INFRA'):
              e2e_domains.append('browser')
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"e2e-domains={json.dumps(e2e_domains)}\n")
          PY

  e2e-identity:
    name: E2E identity
    needs: changes
    if: ${{ github.event_name != 'pull_request' || contains(fromJson(needs.changes.outputs.e2e-domains), 'identity') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: noj-e2e-identity
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-domain
        with:
          domain: identity

  e2e-catalog:
    name: E2E catalog
    needs: changes
    if: ${{ github.event_name != 'pull_request' || contains(fromJson(needs.changes.outputs.e2e-domains), 'catalog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: noj-e2e-catalog
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-domain
        with:
          domain: catalog

  e2e-submission:
    name: E2E submission
    needs: changes
    if: ${{ github.event_name != 'pull_request' || contains(fromJson(needs.changes.outputs.e2e-domains), 'submission') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: noj-e2e-submission
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-domain
        with:
          domain: submission

  e2e-contest:
    name: E2E contest
    needs: changes
    if: ${{ github.event_name != 'pull_request' || contains(fromJson(needs.changes.outputs.e2e-domains), 'contest') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: noj-e2e-contest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-domain
        with:
          domain: contest

  e2e-system:
    name: E2E system
    needs: changes
    if: ${{ github.event_name != 'pull_request' || contains(fromJson(needs.changes.outputs.e2e-domains), 'system') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: noj-e2e-system
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-domain
        with:
          domain: system

  e2e-community:
    name: E2E community
    needs: changes
    if: ${{ github.event_name != 'pull_request' || contains(fromJson(needs.changes.outputs.e2e-domains), 'community') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: noj-e2e-community
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-domain
        with:
          domain: community

  e2e-messaging:
    name: E2E messaging
    needs: changes
    if: ${{ github.event_name != 'pull_request' || contains(fromJson(needs.changes.outputs.e2e-domains), 'messaging') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: noj-e2e-messaging
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-domain
        with:
          domain: messaging

  e2e-objective:
    name: E2E objective
    needs: changes
    if: ${{ github.event_name != 'pull_request' || contains(fromJson(needs.changes.outputs.e2e-domains), 'objective') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: noj-e2e-objective
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-domain
        with:
          domain: objective

  e2e-admin:
    name: E2E admin
    needs: changes
    if: ${{ github.event_name != 'pull_request' || contains(fromJson(needs.changes.outputs.e2e-domains), 'admin') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: noj-e2e-admin
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-domain
        with:
          domain: admin

  e2e-cross-domain:
    name: E2E Cross Domain
    needs: changes
    if: ${{ github.event_name != 'pull_request' || contains(fromJson(needs.changes.outputs.e2e-domains), 'cross-domain') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: noj-e2e-cross-domain
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-domain
        with:
          domain: cross-domain

  e2e-browser:
    name: E2E Browser
    needs: changes
    if: ${{ github.event_name != 'pull_request' || contains(fromJson(needs.changes.outputs.e2e-domains), 'browser') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: noj-e2e-browser
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-domain
        with:
          domain: browser
          browser: 'true'

  judge-sandbox:
    name: Judge Sandbox E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOJ_RUN_E2E: "1"
    permissions:
      actions: write

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6380
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        # 注意：不装 rustfmt/clippy 组件——本 job 只编译并运行测试，
        # 组件越少 rustup 下载失败面越小（曾因并行 cargo 触发 rustup
        # sync 竞争导致 clippy 组件下载失败、测试启动即死）
      - name: 启用 sccache（Rust 编译缓存）
        uses: mozilla/sccache-action@v0.0.11

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            noj-judge/target
          key: cargo-e2e-${{ hashFiles('noj-judge/Cargo.lock') }}
          restore-keys: |
            cargo-e2e-

      - name: 编译 Judge E2E 测试目标
        working-directory: noj-judge
        run: cargo build --tests

      - name: Judge E2E 测试（Docker 沙箱，2 组并行）
        working-directory: noj-judge
        env:
          REDIS_URL: redis://localhost:6380/
        run: |
          # set -euo pipefail：任一 cargo test 失败立即终止整个 job，
          # 修复原版 for 循环吞掉中间失败、只在最后一个目标失败时退出 0 的问题。
          set -euo pipefail
          # rustup 预热（修复 2026-08 并行竞争）：两个 run_group 同时启动
          # cargo 会各自触发 rustup channel sync + 组件下载，竞争同一
          # rustup 状态目录导致 "component download failed"（测试启动即死）。
          # 先单进程触发一次 sync，之后并行 cargo 不再下载。
          cargo --version >/dev/null
          # 必须列出全部 7 个 e2e_* 测试文件（e2e_container_pool 已随容器池
          # 移除而删除；e2e_dual_container / e2e_network_capability 为后续新增，
          # 见 dual-container-judge / capability-network 变更）。
          # 性能优化（2026-07）：目标分 2 组并行——组内串行
          # （serial_test 保证单 binary 内串行），组间并行利用 runner 多核。
          run_group() {
            for target in "$@"; do
              echo ""
              echo "───────────────────────────────────────"
              echo "  $target"
              echo "───────────────────────────────────────"
              NOJ_RUN_E2E=1 cargo test --test "$target" -- --ignored --test-threads=1
            done
          }
          run_group e2e_docker_basic e2e_resource_limits e2e_security_isolation &
          p1=$!
          run_group e2e_support_package e2e_problem_limits &
          p2=$!
          run_group e2e_dual_container e2e_network_capability &
          p3=$!
          fail=0
          wait "$p1" || fail=1
          wait "$p2" || fail=1
          wait "$p3" || fail=1
          exit "$fail"

      # 失败时上传 Docker 沙箱产物
      - name: 上传失败日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: judge-sandbox-logs
          path: |
            noj-judge/target/**/test-*.log
            noj-judge/target/**/deps/
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true
