# =============================================================================
# Neuro OJ — 全链路 E2E 测试
#
# 在每个 PR 和推送到 main 时运行端到端测试（PR 按变更路径精准选择；
# main push / 手动触发 / Release workflow_call 全量执行）：
#   - e2e-api-core / e2e-api-content：合并 6 个标准环境轻量 API 域（2 组复用评测栈）
#   - e2e-submission / e2e-contest / e2e-rate-limit / e2e-cross-domain：独立环境域
#   - e2e-browser-shard (×3) + e2e-browser：UI 浏览器关键流程门禁
#   - judge-sandbox：noj-judge Docker 沙箱 E2E（按 judge 路径过滤）
#   - problem-local-test：noj-cli problem test 本地验题门禁（按 cli/judge/模板路径过滤）
# =============================================================================

name: E2E

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "dev-docs/**"
      - "noj-docs/**"
      - "**/*.md"
      - "docker-compose.yml"
      - "LICENSE"
      - "scripts/db/**"
      - ".github/dependabot.yml"
      - ".github/actionlint.yaml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_PROJECT_NAME: noj-e2e
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  E2E_BASE_URL: http://localhost:8099
  E2E_CORE_PORT: 8099
  E2E_DB_URL: postgres://e2e:e2e@localhost:5433/e2e
  E2E_REDIS_URL: redis://localhost:6380/1
  JWT_SECRET: e2e-ci-secret-fixed-value-with-32-chars-min-abc
  TFA_ENCRYPTION_KEY: e2e-ci-tfa-encryption-key-with-32-chars-min-abc
  NOJ_RUN_E2E: "1"
  BCRYPT_SALT_ROUNDS: 4
  DENO_DIR: ${{ github.workspace }}/noj-core/.deno_cache

jobs:
  changes:
    name: Detect E2E Domains
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e-domains: ${{ steps.selection.outputs.e2e-domains }}
      e2e-browser: ${{ steps.selection.outputs.e2e-browser }}
      judge-sandbox: ${{ steps.filter.outputs.judge-sandbox }}
      problem-local: ${{ steps.filter.outputs.problem-local }}
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: 按独立 E2E 模块路径过滤
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          # 使用 picomatch 内联 extglob '/**/!(*.md)'，避免默认 some(OR) 下独立 '!' 规则扩大匹配。
          filters: |
            judge-sandbox:
              - 'noj-judge/**/!(*.md)'
              - 'docker-compose.e2e.yml'
              - 'env.e2e.template'
              - '.github/workflows/e2e.yml'
            problem-local:
              - 'noj-cli/**/!(*.md)'
              - 'noj-judge/**/!(*.md)'
              - 'fixtures/problem-test/**/!(*.md)'
              - 'noj-core/scripts/problem-templates/**/!(*.md)'
              - '.github/workflows/e2e.yml'

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc

      - name: 计算受影响 E2E 域
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_REF: ${{ github.ref }}
        run: |
          args=(--event "${EVENT_NAME}" --ref "${GIT_REF}")
          if [ -n "${BASE_SHA}" ] && [ -n "${HEAD_SHA}" ]; then
            args+=(--base "${BASE_SHA}" --head "${HEAD_SHA}")
          fi
          deno run --allow-read --allow-env --allow-write --allow-run=git \
            scripts/select-core-ci.ts "${args[@]}"

  # 仅在 Browser E2E 命中（或 main/手动/发布全量）时构建 UI 产物，避免后端 PR 白跑。
  e2e-ui-build:
    name: E2E UI Build
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.e2e-browser == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
      - name: 缓存 UI 依赖
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: noj-ui/node_modules
          key: npm-${{ hashFiles('noj-ui/package.json', 'noj-ui/deno.lock') }}
          restore-keys: |
            npm-
      - name: 安装依赖并构建 UI
        working-directory: noj-ui
        run: |
          deno install
          deno task build
          # tar 保留 Nitro 的隐藏文件、权限和依赖链接。
          tar -cf "$RUNNER_TEMP/e2e-ui.tar" .output
      - name: 上传浏览器测试 UI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-ui
          path: ${{ runner.temp }}/e2e-ui.tar
          retention-days: 1
          compression-level: 1

  # 合并 6 个标准环境轻量 API 域为 2 个并发批次（复用同一评测栈与 canary，
  # 避免 admin/objective 等秒级域各自重复 50s 的镜像加载与迁移启动）。
  e2e-api-core:
    name: E2E API Core (identity / admin / system)
    needs: [changes, e2e-images]
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        contains(fromJson(needs.changes.outputs.e2e-domains), 'identity') ||
        contains(fromJson(needs.changes.outputs.e2e-domains), 'admin') ||
        contains(fromJson(needs.changes.outputs.e2e-domains), 'system')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: noj-e2e-api-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/e2e-domain
        with:
          domain: api-core
          domains: identity admin system
          selected-domains: ${{ github.event_name != 'pull_request' && '["identity","admin","system"]' || needs.changes.outputs.e2e-domains }}

  e2e-api-content:
    name: E2E API Content (catalog / community / objective)
    needs: [changes, e2e-images]
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        contains(fromJson(needs.changes.outputs.e2e-domains), 'catalog') ||
        contains(fromJson(needs.changes.outputs.e2e-domains), 'community') ||
        contains(fromJson(needs.changes.outputs.e2e-domains), 'objective')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: noj-e2e-api-content
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/e2e-domain
        with:
          domain: api-content
          domains: catalog community objective
          selected-domains: ${{ github.event_name != 'pull_request' && '["catalog","community","objective"]' || needs.changes.outputs.e2e-domains }}

  e2e-submission:
    name: E2E submission
    needs: [changes, e2e-images]
    if: ${{ github.event_name != 'pull_request' || contains(fromJson(needs.changes.outputs.e2e-domains), 'submission') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: noj-e2e-submission
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/e2e-domain
        with:
          domain: submission

  e2e-contest:
    name: E2E contest
    needs: [changes, e2e-images]
    if: ${{ github.event_name != 'pull_request' || contains(fromJson(needs.changes.outputs.e2e-domains), 'contest') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: noj-e2e-contest
      E2E_JUDGE_RESOURCE_POOLS: ai,oi-native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 构建比赛 OI Native C++ 运行时
        run: docker build -t noj-oi-cpp:latest noj-judge/docker/oi-cpp
      - uses: ./.github/actions/e2e-domain
        with:
          domain: contest

  e2e-rate-limit:
    name: E2E Rate Limit
    needs: [changes, e2e-images]
    if: ${{ github.event_name != 'pull_request' || contains(fromJson(needs.changes.outputs.e2e-domains), 'rate-limit') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: noj-e2e-rate-limit
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_LOGIN_IP_MAX: "1000"
      RATE_LIMIT_LOGIN_ACC_MAX: "1000"
      RATE_LIMIT_LOGIN_BACKOFF_SEC: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/e2e-domain
        with:
          domain: rate-limit

  e2e-cross-domain:
    name: E2E Cross Domain
    needs: [changes, e2e-images]
    if: ${{ github.event_name != 'pull_request' || contains(fromJson(needs.changes.outputs.e2e-domains), 'cross-domain') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: noj-e2e-cross-domain
      E2E_JUDGE_RESOURCE_POOLS: ai,oi-native
      NOJ_E2E_REQUIRE_DRILL: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 构建教学 OI Native C++ 运行时
        run: docker build -t noj-oi-cpp:latest noj-judge/docker/oi-cpp
      - uses: ./.github/actions/e2e-domain
        with:
          domain: cross-domain

  e2e-browser-shard:
    name: E2E Browser (${{ matrix.shard }})
    needs: [changes, e2e-images, e2e-ui-build]
    if: ${{ github.event_name != 'pull_request' || contains(fromJson(needs.changes.outputs.e2e-domains), 'browser') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [browser1, browser2, browser3]
    env:
      COMPOSE_PROJECT_NAME: noj-e2e-browser-${{ matrix.shard }}
      E2E_BROWSER_SHARD: ${{ matrix.shard }}
      E2E_BROWSER_GROUPS: "3"
      E2E_EVALUATOR_NETWORK: noj-e2e-browser-${{ matrix.shard }}-evaluator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/e2e-domain
        with:
          domain: browser
          browser: "true"
          shard: ${{ matrix.shard }}
          groups: "3"

  e2e-browser:
    name: E2E Browser
    needs: [changes, e2e-browser-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 聚合 Browser 分片结果
        env:
          BROWSER_SELECTED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.e2e-browser == 'true' }}
          SHARD_RESULT: ${{ needs.e2e-browser-shard.result }}
        run: |
          set -euo pipefail
          echo "browser_selected=${BROWSER_SELECTED} shard_result=${SHARD_RESULT}"
          if [ "${BROWSER_SELECTED}" != "true" ]; then
            echo "未选择 Browser 测试：本次改动不触发 Browser E2E（显式记录，不视为已验证）。"
            exit 0
          fi
          case "${SHARD_RESULT}" in
            success)
              echo "Browser 三个分片全部成功。"
              ;;
            *)
              echo "::error::Browser 分片结果=${SHARD_RESULT}；选中分片失败/取消/缺失不能聚合为成功。"
              exit 1
              ;;
          esac

  e2e-images:
    name: E2E Image (${{ matrix.image }})
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.e2e-domains != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: evaluator
            context: noj-judge
            file: noj-judge/docker/evaluator-python/Dockerfile
            tag: noj-evaluator-python
          - image: solution
            context: noj-judge
            file: noj-judge/docker/solution-python/Dockerfile
            tag: noj-solution-python
          - image: core
            context: noj-core
            file: noj-core/Dockerfile.e2e
            tag: noj-e2e-core
          - image: judge
            context: noj-judge
            file: noj-judge/Dockerfile.e2e
            tag: noj-e2e-judge
            cache-mode: max
          - image: gateway
            context: noj-llm-gateway
            file: noj-llm-gateway/Dockerfile
            tag: noj-e2e-llm-gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 设置 Docker BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: 构建镜像（带 GHA 缓存）
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: ${{ matrix.tag }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.image }}.tar
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: ${{ github.event.pull_request.head.repo.fork && 'type=inline' || format('type=gha,mode={0},scope={1}', matrix.cache-mode || 'min', matrix.image) }}
      - name: 上传镜像
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-image-${{ matrix.image }}
          path: ${{ runner.temp }}/${{ matrix.image }}.tar
          retention-days: 1
          compression-level: 1

  judge-sandbox:
    name: Judge Sandbox E2E
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.judge-sandbox == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOJ_RUN_E2E: "1"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      NOJ_E2E_PYTHON_IMAGE_REPO: python
    permissions:
      actions: write

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - name: 启用 sccache（Rust 编译缓存）
        uses: mozilla/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: 缓存 Cargo 注册表
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('noj-judge/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: 验证沙箱分组覆盖与失败传播
        run: python3 -m unittest discover -s noj-judge/scripts -p 'test_ci_*.py'

      - name: 并行编译沙箱测试与构建 OI 镜像
        working-directory: noj-judge
        run: |
          set -euo pipefail
          build_args=(--locked)
          for target in tests/e2e_*.rs; do
            target_name="${target##*/}"
            build_args+=(--test "${target_name%.rs}")
          done
          cargo build "${build_args[@]}" > "$RUNNER_TEMP/noj-sandbox-build.log" 2>&1 &
          build_pid=$!
          docker build -t noj-oi-cpp:latest docker/oi-cpp > "$RUNNER_TEMP/noj-oi-image-build.log" 2>&1 &
          image_pid=$!
          fail=0
          wait "$build_pid" || fail=1
          wait "$image_pid" || fail=1
          cat "$RUNNER_TEMP/noj-sandbox-build.log" "$RUNNER_TEMP/noj-oi-image-build.log"
          exit "$fail"

      - name: Judge E2E 测试（Docker 沙箱，4 组并行）
        working-directory: noj-judge
        env:
          REDIS_URL: redis://localhost:6380/
        run: |
          set -euo pipefail
          cargo --version >/dev/null
          run_group() {
            for target in "$@"; do
              echo ""
              echo "───────────────────────────────────────"
              echo "  $target"
              echo "───────────────────────────────────────"
              NOJ_RUN_E2E=1 cargo test --locked --test "$target" -- --ignored --test-threads=1
            done
          }
          run_group e2e_docker_basic e2e_resource_limits e2e_security_isolation &
          p1=$!
          run_group e2e_support_package e2e_problem_limits e2e_oi_native &
          p2=$!
          run_group e2e_dual_container e2e_network_capability e2e_abnormal e2e_prediction &
          p3=$!
          run_group e2e_solution_ai &
          p4=$!
          fail=0
          wait "$p1" || fail=1
          wait "$p2" || fail=1
          wait "$p3" || fail=1
          wait "$p4" || fail=1
          exit "$fail"

      - name: 上传失败日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: judge-sandbox-logs
          path: |
            noj-judge/target/**/test-*.log
            ${{ runner.temp }}/noj-*-build.log
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true

  problem-local-test:
    name: Problem Local Test
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.problem-local == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - name: 启用 sccache（Rust 编译缓存）
        uses: mozilla/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: 缓存 Cargo 注册表
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('noj-judge/Cargo.lock') }}
          restore-keys: |
            cargo-registry-
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc

      - name: 并行编译 noj-judge 与构建评测镜像
        run: |
          set -euo pipefail
          (cd noj-judge && cargo build --locked --bin noj-judge) > "$RUNNER_TEMP/noj-judge-build.log" 2>&1 &
          build_pid=$!
          docker build -t noj-evaluator-python -f noj-judge/docker/evaluator-python/Dockerfile noj-judge > "$RUNNER_TEMP/noj-evaluator-image-build.log" 2>&1 &
          eval_pid=$!
          docker build -t noj-solution-python -f noj-judge/docker/solution-python/Dockerfile noj-judge > "$RUNNER_TEMP/noj-solution-image-build.log" 2>&1 &
          sol_pid=$!
          fail=0
          wait "$build_pid" || fail=1
          wait "$eval_pid" || fail=1
          wait "$sol_pid" || fail=1
          cat "$RUNNER_TEMP"/noj-*-build.log
          exit "$fail"

      - name: problem test（正向断言 + 负例）
        working-directory: noj-cli
        env:
          NOJ_JUDGE_BIN: ${{ github.workspace }}/noj-judge/target/debug/noj-judge
        run: |
          set -uo pipefail
          for dir in ../fixtures/problem-test/*/; do
            echo "── problem test ${dir}"
            deno run -A src/cli.ts problem test "$dir" || exit 1
          done
          code=0
          deno run -A src/cli.ts problem test ../fixtures/problem-test/aplusb --expect wrong=100 || code=$?
          if [ "$code" -ne 1 ]; then
            echo "负例期望退出码 1，实际 ${code}"
            exit 1
          fi

      - name: problem init --template 五类模板验题
        working-directory: noj-cli
        env:
          NOJ_JUDGE_BIN: ${{ github.workspace }}/noj-judge/target/debug/noj-judge
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/problem-templates"
          for t in code prediction llm objective ui; do
            echo "── template ${t}"
            deno run -A src/cli.ts problem init "tpl-${t}" --template "$t" --no-interactive --dir "$out"
            deno run -A src/cli.ts problem lint --strict "$out/tpl-${t}"
            deno run -A src/cli.ts problem test "$out/tpl-${t}"
          done
