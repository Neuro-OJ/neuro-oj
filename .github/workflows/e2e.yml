# =============================================================================
# Neuro OJ — 全链路 E2E 测试
#
# 在每个 PR 和推送到 main 时运行完整的端到端测试：
#   - e2e-full：noj-tests 全量 E2E（30 个测试文件 / 204 个 e2eTest 用例）
#   - judge-sandbox：noj-judge Docker 沙箱 E2E（7 个 binary，独立 job）
#
# 使用 Docker Compose 编排完整评测栈（noj-core + noj-judge + PostgreSQL + Redis）。
#
# 技术栈：Deno + Rust + Docker Compose
# 运行时间：首次 ~15min，缓存命中后 ~5-8min
#
# 性能优化（2026-07）：
#   - judge 沙箱 E2E 拆为独立 job（它只依赖 Docker + Redis，测试内自建
#     评测镜像 ensure_test_image，无需 noj-core 栈），与 API E2E 并行，
#     总时长从串行 ~15min 降到 max(API, sandbox) ~8min
#   - noj-tests 30 个文件分 3 组并行（组间独立进程；文件间无跨文件固定
#     ID 依赖，admin 改密竞态由 helper.ts loginAndChangePassword 并发
#     兜底处理）
#   - judge-sandbox 复用 sccache 编译缓存 + 7 个 binary 分 3 组并行
# =============================================================================

name: E2E

# workflow-level 最小权限：所有 job 默认 contents: read。修复 finding S3。
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    # 纯文档 / 规范 / lint 配置类改动无需跑完整评测栈（节省 10-15 min / PR）。
    # push to main 仍全量跑；workflow_dispatch 仍可手动强跑。
    # 修复点：之前的 cache-to mode=min 拆分到独立的 workflow 安全与配置一致性 PR。
    # 性能优化（2026-07）：扩充忽略清单——noj-ui 改动不涉及评测栈
    # （E2E 只跑 noj-core API + judge 沙箱，不构建前端）；ci.yml 自身
    # 改动不触发 e2e（ci.yml 不涉及评测栈镜像/编排）。
    paths-ignore:
      - 'docs/**'
      - 'noj-docs/**'
      - '**/*.md'
      - 'openspec/**'
      - '.opencode/**'
      - '.claude/**'
      - 'noj-ui/**'
      - 'docker-compose.yml'
      - 'LICENSE'
      - 'scripts/dev/**'
      - 'scripts/db/**'
      - '.github/dependabot.yml'
      - '.github/actionlint.yaml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# 仅 PR 上可取消旧运行（修复 finding M4），main 推送不可被取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_PROJECT_NAME: noj-e2e
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  E2E_BASE_URL: http://localhost:8099
  E2E_CORE_PORT: 8099
  E2E_DB_URL: postgres://e2e:e2e@localhost:5433/e2e
  E2E_REDIS_URL: redis://localhost:6380/1
  # JWT_SECRET 单一来源（修复 finding S1）。
  # 全仓库（e2e.yml workflow env、docker-compose.e2e.yml noj-core、env.e2e.template）
  # 统一使用此值；任何一处修改必须同步另外两处。
  # 长度 ≥32 满足 noj-core main.ts 的 JWT_SECRET ≥ 32 字符校验。
  JWT_SECRET: e2e-ci-secret-fixed-value-with-32-chars-min-abc
  # TFA_ENCRYPTION_KEY 单一来源，与 docker-compose.e2e.yml / env.e2e.template 保持一致。
  TFA_ENCRYPTION_KEY: e2e-ci-tfa-encryption-key-with-32-chars-min-abc
  NOJ_RUN_E2E: "1"
  BCRYPT_SALT_ROUNDS: 4
  DENO_DIR: ${{ github.workspace }}/noj-core/.deno_cache

jobs:
  # ===========================================================================
  # e2e — noj-tests 全链路 API E2E（完整评测栈）
  # ===========================================================================
  e2e:
    name: Full Pipeline (API E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ── 安装工具链 ────────────────────────────

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # ── 设置 Docker BuildKit（用于镜像构建缓存）──

      - name: 设置 Docker BuildKit
        uses: docker/setup-buildx-action@v3

      # ── 缓存依赖 ──────────────────────────────

      - name: 缓存 Deno 依赖
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/noj-core/.deno_cache
          key: deno-${{ hashFiles('noj-core/deno.lock') }}
          restore-keys: |
            deno-

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            noj-judge/target
          key: cargo-e2e-${{ hashFiles('noj-judge/Cargo.lock') }}
          restore-keys: |
            cargo-e2e-

      # ════════════════════════════════════════════
      # 1. 构建基础设施：支持包 + 评测镜像（带 Docker 缓存）
      # ════════════════════════════════════════════

      - name: 安装 Deno 依赖
        working-directory: noj-core
        run: deno install

      - name: 构建题目支持包 (packages/*.zip)
        working-directory: noj-core
        run: deno task problems:build
        env:
          DENO_DIR: ${{ env.DENO_DIR }}

      - name: 构建评测镜像 (noj-evaluator-python, 带 GHA 缓存)
        uses: docker/build-push-action@v6
        with:
          context: noj-judge
          file: noj-judge/docker/evaluator-python/Dockerfile
          tags: noj-evaluator-python
          load: true
          cache-from: type=gha
          # Fork PR 的 GITHUB_TOKEN 是 read-only，cache 写入会失败且
          # 浪费存储（修复 finding S6 + P7）。原模式 mode=max 还会把缓存
          # 体积推到 5-10× image size。改用 fork 感知 + 较小 cache。
          cache-to: ${{ github.event.pull_request.head.repo.fork && 'type=inline' || 'type=gha,mode=min' }}

      - name: 构建评测镜像 (noj-solution-python, 带 GHA 缓存)
        uses: docker/build-push-action@v6
        with:
          context: noj-judge
          file: noj-judge/docker/solution-python/Dockerfile
          tags: noj-solution-python
          load: true
          cache-from: type=gha
          cache-to: ${{ github.event.pull_request.head.repo.fork && 'type=inline' || 'type=gha,mode=min' }}

      - name: 构建 Docker Compose 镜像 (noj-core, 带 GHA 缓存)
        uses: docker/build-push-action@v6
        with:
          context: noj-core
          file: noj-core/Dockerfile.e2e
          tags: noj-e2e-core
          load: true
          build-args: CACHE_BUST=${{ github.run_id }}
          cache-from: type=gha,scope=${{ github.head_ref || github.ref_name }}
          cache-to: ${{ github.event.pull_request.head.repo.fork && 'type=inline' || format('type=gha,mode=min,scope={0}', github.head_ref || github.ref_name) }}

      - name: 构建 Docker Compose 镜像 (noj-judge, 带 GHA 缓存)
        uses: docker/build-push-action@v6
        with:
          context: noj-judge
          file: noj-judge/Dockerfile.e2e
          tags: noj-e2e-judge
          load: true
          cache-from: type=gha
          cache-to: ${{ github.event.pull_request.head.repo.fork && 'type=inline' || 'type=gha,mode=min' }}

      - name: 构建 Docker Compose 镜像 (noj-llm-gateway, 带 GHA 缓存)
        uses: docker/build-push-action@v6
        with:
          context: noj-llm-gateway
          file: noj-llm-gateway/Dockerfile
          tags: noj-e2e-llm-gateway
          load: true
          cache-from: type=gha
          cache-to: ${{ github.event.pull_request.head.repo.fork && 'type=inline' || 'type=gha,mode=min' }}

      - name: 初始化 MinIO bucket
        run: |
          docker compose -f docker-compose.e2e.yml -p $COMPOSE_PROJECT_NAME up -d minio minio-init

      # ════════════════════════════════════════════
      # 2. 启动 E2E 评测栈（使用预构建镜像，不触发 rebuild）
      # ════════════════════════════════════════════

      - name: 启动评测栈（使用预构建镜像，不触发 rebuild）
        run: |
          docker compose -f docker-compose.e2e.yml -p $COMPOSE_PROJECT_NAME up -d --no-build
          # 修复 finding C4 + C8：原版用 timeout 60 bash + curl 探测，
          # 且失败用 `|| echo ⚠` 静默吞下，导致后续 70+ 测试在 noj-core
          # 未起来时跑出 ECONNREFUSED 伪装成测试失败。
          #
          # 改用 docker inspect 轮询 Health.Status：
          #   - status=healthy → 成功
          #   - 容器已退出（main.ts 启动失败 / migration 失败等）→ 立即诊断退出
          #
          # 一改前：noj-core 启动时跑 migrate + seed（实测 25-30 min），
          # 一改后：拆分出 noj-migrate one-shot 提前跑 migrate + seed，
          # noj-core 容器只启动 HTTP server + deno runtime（启动 ~4 min）。
          # v13 fix：放弃 deno compile AOT（Alpine musl vs glibc binary 兼容性
          # 问题过多），改用 deno cache 预热 + bash loop 拉长到 600s 兜底
          # cold-start。
          echo "等待 noj-core 健康（bash 轮询 docker inspect，600s 超时）..."
          for i in $(seq 1 600); do
            status=$(docker inspect --format='{{.State.Health.Status}}' \
                     noj-e2e-core 2>/dev/null || echo "missing")
            if [ "$status" = "healthy" ]; then
              echo "✅ noj-core 健康就绪 ($i s)"
              exit 0
            fi
            # v12 fix：原 `! docker ps` 检查在容器还没 created 时误报
            # "已退出"（race condition）。改用 docker inspect State.Status
            # 只判 exited/dead 状态。
            state=$(docker inspect --format='{{.State.Status}}' \
                    noj-e2e-core 2>/dev/null || echo "missing")
            if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
              echo "::error::noj-core 容器已退出，状态=$state (health=$status)"
              docker compose -f docker-compose.e2e.yml -p $COMPOSE_PROJECT_NAME \
                logs --tail=100 noj-core
              exit 1
            fi
            sleep 1
          done
          echo "::error::noj-core 未在 600s 内健康就绪 (status=$status)"
          docker compose -f docker-compose.e2e.yml -p $COMPOSE_PROJECT_NAME \
            logs --tail=100 noj-core
          exit 1

      # ════════════════════════════════════════════
      # 3. noj-tests E2E 测试（3 组并行）
      #
      # 性能优化（2026-07）：30 个测试文件按字母序均分为 3 组，组间
      # 独立进程并行。文件间无跨文件固定 ID 依赖（此前已审计）；唯一
      # 共享状态是 admin 账户（getAdminToken 改密竞态由 helper.ts 并发
      # 兜底）与评测队列（并发提交由 judge 多容器并行消化）。
      # ════════════════════════════════════════════

      - name: 校验 E2E 文件均已加入 workflow 清单
        working-directory: noj-tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = sorted(p.name for p in Path('e2e').glob('*.test.ts'))
          wf = Path('../.github/workflows/e2e.yml').read_text(encoding='utf-8')
          missing = [f for f in files if f not in wf]
          if missing:
              raise SystemExit(f"E2E 文件未在 e2e.yml 清单中: {', '.join(missing)}")
          print(f"OK: {len(files)} 个 E2E 文件均已在 workflow 中")
          PY

      - name: E2E 测试 (noj-tests, 3 组并行)
        working-directory: noj-tests
        env:
          E2E_BASE_URL: ${{ env.E2E_BASE_URL }}
          E2E_LLM_MOCK_URL: http://llm-mock:8002/v1
        run: |
          # set -euo pipefail：任一 deno test 失败立即终止整个 job
          set -euo pipefail
          run_group() {
            deno test -A "$@"
          }
          run_group \
            e2e/01_tags.test.ts \
            e2e/02_problems.test.ts \
            e2e/03_auth.test.ts \
            e2e/04_submissions.test.ts \
            e2e/05_profile.test.ts \
            e2e/06_pipeline.test.ts \
            e2e/07_queue.test.ts \
            e2e/08_password_change_guard.test.ts &
          p1=$!
          run_group \
            e2e/09_checkin.test.ts \
            e2e/10_sse.test.ts \
            e2e/11_messaging.test.ts \
            e2e/12_audit_log.test.ts \
            e2e/13_support_package_s3.test.ts \
            e2e/14_rejudge.test.ts \
            e2e/15_dual_container_judge.test.ts &
          p2=$!
          run_group \
            e2e/16_community.test.ts \
            e2e/17_problem_template.test.ts \
            e2e/18_search.test.ts \
            e2e/19_admin_endpoints.test.ts \
            e2e/20_password_reset.test.ts \
            e2e/21_rankings.test.ts \
            e2e/22_contest_lifecycle.test.ts \
            e2e/23_network_capability.test.ts \
            e2e/24_import_bundle.test.ts \
            e2e/25_rbac.test.ts \
            e2e/26_call_timeout.test.ts \
            e2e/27_objective.test.ts \
            e2e/28_announcements.test.ts \
            e2e/28_clarifications.test.ts \
            e2e/29_avatar.test.ts \
            e2e/30_self_test.test.ts \
            e2e/31_tfa.test.ts \
            e2e/32_llm_gateway.test.ts \
            e2e/trainings.test.ts &
          p3=$!
          fail=0
          wait "$p1" || fail=1
          wait "$p2" || fail=1
          wait "$p3" || fail=1
          exit "$fail"

      # ════════════════════════════════════════════
      # 6. 诊断日志（即使前面失败也执行）
      # ════════════════════════════════════════════

      - name: 输出 noj-migrate 日志
        if: always()
        run: |
          echo "=== noj-migrate 日志 ==="
          docker compose -f docker-compose.e2e.yml -p $COMPOSE_PROJECT_NAME logs --tail=100 noj-migrate 2>&1 || echo "容器可能未启动"

      - name: 输出 noj-judge 日志
        if: always()
        run: |
          echo "=== noj-judge 日志 ==="
          docker compose -f docker-compose.e2e.yml -p $COMPOSE_PROJECT_NAME logs --tail=100 noj-judge 2>&1 || echo "容器可能未启动"

      - name: 输出 noj-core 日志
        if: always()
        run: |
          echo "=== noj-core 日志 ==="
          docker compose -f docker-compose.e2e.yml -p $COMPOSE_PROJECT_NAME logs --tail=100 noj-core 2>&1 || echo "容器可能未启动"

      - name: 输出 noj-llm-gateway 日志
        if: always()
        run: |
          echo "=== noj-llm-gateway 日志 ==="
          docker compose -f docker-compose.e2e.yml -p $COMPOSE_PROJECT_NAME logs --tail=100 noj-llm-gateway 2>&1 || echo "容器可能未启动"

      # 失败时把诊断日志落盘 + 上传为 GitHub Actions artifact
      # (修复 finding M7/S8)。原版只 echo 到 GHA log，contributor 必须本地复现才能排查。
      # 改写为：docker logs 重定向到文件，再 upload-artifact。
      - name: 保存 + 上传 noj-judge 日志
        if: always()
        run: |
          docker compose -f docker-compose.e2e.yml -p $COMPOSE_PROJECT_NAME logs --tail=500 noj-judge > noj-judge.log 2>&1 || echo "noj-judge may not be running"

      - name: 保存 + 上传 noj-migrate 日志
        if: always()
        run: |
          docker compose -f docker-compose.e2e.yml -p $COMPOSE_PROJECT_NAME logs --tail=500 noj-migrate > noj-migrate.log 2>&1 || echo "noj-migrate may not be running"

      - name: 保存 + 上传 noj-core 日志
        if: always()
        run: |
          docker compose -f docker-compose.e2e.yml -p $COMPOSE_PROJECT_NAME logs --tail=500 noj-core > noj-core.log 2>&1 || echo "noj-core may not be running"

      - name: 保存 + 上传 noj-llm-gateway 日志
        if: always()
        run: |
          docker compose -f docker-compose.e2e.yml -p $COMPOSE_PROJECT_NAME logs --tail=500 noj-llm-gateway > noj-llm-gateway.log 2>&1 || echo "noj-llm-gateway may not be running"

      - name: 上传诊断日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-pipeline-logs
          path: |
            noj-judge.log
            noj-migrate.log
            noj-core.log
            noj-llm-gateway.log
            /tmp/noj-work/
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true

      # ════════════════════════════════════════════
      # 7. 清理
      # ════════════════════════════════════════════

      - name: 清理评测栈
        if: always()
        run: |
          docker compose -f docker-compose.e2e.yml -p $COMPOSE_PROJECT_NAME down -v

  # ===========================================================================
  # judge-sandbox — noj-judge Docker 沙箱 E2E（独立 job）
  #
  # 性能优化（2026-07）：从原单一大 job 拆出。沙箱测试只依赖 Docker
  # daemon + Redis（评测镜像由测试内 ensure_test_image 自建），不需要
  # noj-core 栈，因此与 API E2E job 完全并行。结构上与 ci.yml 的
  # judge-e2e 保持一致（sccache + 2 组并行）。
  # ===========================================================================
  judge-sandbox:
    name: Judge Sandbox E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOJ_RUN_E2E: "1"
    permissions:
      actions: write

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6380
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        # 注意：不装 rustfmt/clippy 组件——本 job 只编译并运行测试，
        # 组件越少 rustup 下载失败面越小（曾因并行 cargo 触发 rustup
        # sync 竞争导致 clippy 组件下载失败、测试启动即死）
      - name: 启用 sccache（Rust 编译缓存）
        uses: mozilla/sccache-action@v0.0.11
        with:
          cache-name: judge-sandbox-sccache

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            noj-judge/target
          key: cargo-e2e-${{ hashFiles('noj-judge/Cargo.lock') }}
          restore-keys: |
            cargo-e2e-

      - name: 编译 Judge E2E 测试目标
        working-directory: noj-judge
        run: cargo build --tests

      - name: Judge E2E 测试（Docker 沙箱，2 组并行）
        working-directory: noj-judge
        env:
          REDIS_URL: redis://localhost:6380/
        run: |
          # set -euo pipefail：任一 cargo test 失败立即终止整个 job，
          # 修复原版 for 循环吞掉中间失败、只在最后一个目标失败时退出 0 的问题。
          set -euo pipefail
          # rustup 预热（修复 2026-08 并行竞争）：两个 run_group 同时启动
          # cargo 会各自触发 rustup channel sync + 组件下载，竞争同一
          # rustup 状态目录导致 "component download failed"（测试启动即死）。
          # 先单进程触发一次 sync，之后并行 cargo 不再下载。
          cargo --version >/dev/null
          # 必须列出全部 7 个 e2e_* 测试文件（e2e_container_pool 已随容器池
          # 移除而删除；e2e_dual_container / e2e_network_capability 为后续新增，
          # 见 dual-container-judge / capability-network 变更）。
          # 性能优化（2026-07）：目标分 2 组并行——组内串行
          # （serial_test 保证单 binary 内串行），组间并行利用 runner 多核。
          run_group() {
            for target in "$@"; do
              echo ""
              echo "───────────────────────────────────────"
              echo "  $target"
              echo "───────────────────────────────────────"
              NOJ_RUN_E2E=1 cargo test --test "$target" -- --ignored --test-threads=1
            done
          }
          run_group e2e_docker_basic e2e_resource_limits e2e_security_isolation &
          p1=$!
          run_group e2e_support_package e2e_problem_limits &
          p2=$!
          run_group e2e_dual_container e2e_network_capability &
          p3=$!
          fail=0
          wait "$p1" || fail=1
          wait "$p2" || fail=1
          wait "$p3" || fail=1
          exit "$fail"

      # 失败时上传 Docker 沙箱产物
      - name: 上传失败日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: judge-sandbox-logs
          path: |
            noj-judge/target/**/test-*.log
            noj-judge/target/**/deps/
          retention-days: 7
          if-no-files-found: ignore
