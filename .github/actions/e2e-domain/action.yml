name: E2E Domain
description: 构建完整评测栈并运行指定 Domain / 合并批次的 E2E 测试（或 UI 浏览器门禁）

inputs:
  domain:
    description: 单个 E2E Domain 目录名（如 submission / contest / cross-domain / browser）或批次标签（配合 domains 使用）
    required: true
  domains:
    description: 可选：空格分隔的轻量 API Domain 列表（合并批次运行，复用同一套评测栈）
    required: false
    default: ""
  selected-domains:
    description: 可选：本次 changes 选中的 E2E Domain JSON 数组（用于在批次中仅运行命中的域）
    required: false
    default: ""
  browser:
    description: 是否运行 UI 浏览器门禁（true/false）
    required: false
    default: "false"
  shard:
    description: Browser 分组标识（如 browser1）；留空表示不分组
    required: false
    default: ""
  groups:
    description: Browser 分组总数（shard 非空时生效）
    required: false
    default: "3"

runs:
  using: composite
  steps:
    # ── 安装工具链 ────────────────────────────
    - name: 安装 Deno
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version-file: .dvmrc

    # ── 缓存依赖 ──────────────────────────────

    - name: 缓存 Deno 依赖
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ github.workspace }}/noj-core/.deno_cache
        key: deno-${{ hashFiles('noj-core/deno.lock') }}
        restore-keys: |
          deno-

    # ════════════════════════════════════════════
    # 1. 构建基础设施：支持包 + 评测镜像（带 Docker 缓存）
    # ════════════════════════════════════════════

    - name: 安装 Deno 依赖
      working-directory: noj-core
      run: deno install
      shell: bash

    - name: 构建题目支持包 (packages/*.zip)
      working-directory: noj-core
      run: deno task problems:build
      shell: bash
      env:
        DENO_DIR: ${{ env.DENO_DIR }}

    # 5 个镜像由 e2e.yml 的 e2e-images job 统一构建一次并以 artifact 分发，
    # 各 Domain job 只加载，避免各 job 各自重复构建。
    - name: 下载预构建镜像
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: e2e-image-*
        path: ${{ runner.temp }}/e2e-images
        merge-multiple: true

    - name: 加载镜像并启动基础设施
      run: |
        set -euo pipefail
        # 基础设施不依赖预构建镜像，拉取与健康检查在 docker load 期间执行。
        docker compose -f docker-compose.e2e.yml -p "$COMPOSE_PROJECT_NAME" \
          up -d postgres redis minio minio-init llm-mock &
        infra_pid=$!
        fail=0
        ls "$RUNNER_TEMP"/e2e-images/*.tar | xargs -P 5 -n 1 docker load -i || fail=1
        wait "$infra_pid" || fail=1
        docker images
        exit "$fail"
      shell: bash

    # ════════════════════════════════════════════
    # 2. 启动 E2E 评测栈（使用预构建镜像，不触发 rebuild）
    # ════════════════════════════════════════════

    - name: 启动评测栈（使用预构建镜像，不触发 rebuild）
      run: |
        docker compose -f docker-compose.e2e.yml -p $COMPOSE_PROJECT_NAME up -d --no-build
        echo "等待 noj-core 健康（bash 轮询 docker inspect，600s 超时）..."
        core_id=$(docker compose -f docker-compose.e2e.yml -p $COMPOSE_PROJECT_NAME ps -q noj-core)
        for i in $(seq 1 600); do
          if [ -z "$core_id" ]; then
            status=missing
            state=missing
          else
            status=$(docker inspect --format='{{.State.Health.Status}}' "$core_id" 2>/dev/null || echo "missing")
            state=$(docker inspect --format='{{.State.Status}}' "$core_id" 2>/dev/null || echo "missing")
          fi
          if [ "$status" = "healthy" ]; then
            echo "✅ noj-core 健康就绪 ($i s)"
            exit 0
          fi
          if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
            echo "::error::noj-core 容器已退出，状态=$state (health=$status)"
            docker compose -f docker-compose.e2e.yml -p $COMPOSE_PROJECT_NAME \
              logs --tail=100 noj-core
            exit 1
          fi
          sleep 1
        done
        echo "::error::noj-core 未在 600s 内健康就绪 (status=$status)"
        docker compose -f docker-compose.e2e.yml -p $COMPOSE_PROJECT_NAME \
          logs --tail=100 noj-core
        exit 1
      shell: bash

    - name: 解析 E2E 容器 ID
      run: |
        set -euo pipefail
        compose=(docker compose -f docker-compose.e2e.yml -p "$COMPOSE_PROJECT_NAME")
        resolve() {
          local var="$1" service="$2" id
          id=$("${compose[@]}" ps -q "$service")
          if [ -z "$id" ]; then
            echo "::error::无法解析 $service 容器 ID（Compose project=$COMPOSE_PROJECT_NAME）"
            exit 1
          fi
          echo "$var=$id" >> "$GITHUB_ENV"
        }
        resolve E2E_REDIS_CONTAINER redis
        resolve E2E_POSTGRES_CONTAINER postgres
        resolve E2E_MINIO_CONTAINER minio
        resolve E2E_CORE_CONTAINER noj-core
        resolve E2E_JUDGE_CONTAINER noj-judge
        resolve E2E_GATEWAY_CONTAINER noj-llm-gateway
      shell: bash

    # ════════════════════════════════════════════
    # 3. 测试：API E2E（单域或合并批次）或 UI 浏览器门禁
    # ════════════════════════════════════════════

    - name: E2E 测试 (noj-tests, Domain)
      if: inputs.browser != 'true'
      working-directory: noj-tests
      env:
        E2E_BASE_URL: ${{ env.E2E_BASE_URL }}
        E2E_LLM_MOCK_URL: http://noj-e2e-llm-mock:8002/v1
        E2E_DOMAIN: ${{ inputs.domain }}
        E2E_DOMAINS: ${{ inputs.domains }}
        E2E_SELECTED_DOMAINS: ${{ inputs.selected-domains }}
      run: |
        set -euo pipefail
        if [ -n "$E2E_DOMAINS" ]; then
          paths=()
          for d in $E2E_DOMAINS; do
            if [ -z "$E2E_SELECTED_DOMAINS" ] || echo "$E2E_SELECTED_DOMAINS" | jq -e --arg d "$d" 'index($d) != null' >/dev/null; then
              paths+=("e2e/$d")
            fi
          done
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "::error::批次 ($E2E_DOMAINS) 未匹配任何选中域（selected=$E2E_SELECTED_DOMAINS），拒绝空跑假绿"
            exit 1
          fi
          echo "运行合并批次 E2E：${paths[*]}"
          deno task test:api --shard "$E2E_DOMAIN" "${paths[@]}"
        else
          deno task test:domain "$E2E_DOMAIN"
        fi
      shell: bash

    - name: 下载浏览器测试 UI
      if: inputs.browser == 'true'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: e2e-ui
        path: ${{ runner.temp }}/e2e-ui

    - name: 加载浏览器测试 UI
      if: inputs.browser == 'true'
      working-directory: noj-ui
      run: |
        tar -xf "$RUNNER_TEMP/e2e-ui/e2e-ui.tar"
        test -f .output/server/index.mjs
      shell: bash

    - name: 启动 noj-ui
      if: inputs.browser == 'true'
      run: |
        NUXT_API_BASE=http://localhost:8099 PORT=3000 \
          deno run -A noj-ui/.output/server/index.mjs > /tmp/noj-ui.log 2>&1 &
        for i in $(seq 1 60); do
          if curl -sf http://localhost:3000/ > /dev/null; then
            echo "✅ noj-ui 就绪 (:3000)"
            break
          fi
          sleep 1
        done
        if ! curl -sf http://localhost:3000/ > /dev/null; then
          echo "::error::noj-ui 启动超时"
          tail -50 /tmp/noj-ui.log
          exit 1
        fi
      shell: bash

    - name: 重建搜索索引（浏览器测试前置）
      if: inputs.browser == 'true'
      working-directory: noj-core
      env:
        DATABASE_URL: ${{ env.E2E_DB_URL }}
      run: deno run -A scripts/noj.ts search reindex
      shell: bash

    - name: 切换支持包验收至真实 S3 存储
      if: inputs.domain == 'submission'
      run: |
        docker compose -f docker-compose.e2e.yml -f docker-compose.e2e-s3.yml \
          -p "$COMPOSE_PROJECT_NAME" up -d --no-build --no-deps --wait --wait-timeout 120 noj-core
      shell: bash

    - name: 真实 S3 支持包版本与权限验收
      if: inputs.domain == 'submission'
      working-directory: noj-tests
      env:
        STORAGE_PROVIDER: s3
        S3_ENDPOINT: http://localhost:9002
        S3_REGION: us-east-1
        S3_ACCESS_KEY: minioadmin
        S3_SECRET_KEY: minioadmin
        S3_BUCKET: noj-support-packages
        S3_FORCE_PATH_STYLE: "true"
      run: deno task test:domain submission --filter=e2e/s3-support-pkg --no-canary
      shell: bash

    - name: 缓存 Playwright 浏览器
      id: pw-cache
      if: inputs.browser == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('noj-tests/deno.lock') }}
        restore-keys: |
          playwright-

    - name: 安装 Playwright Chromium
      if: inputs.browser == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
      run: deno run -A npm:playwright@1.65.1 install chromium
      shell: bash

    - name: UI 浏览器关键流程测试 (noj-tests test:browser)
      if: inputs.browser == 'true'
      working-directory: noj-tests
      env:
        NOJ_RUN_BROWSER_E2E: "1"
        E2E_UI_URL: http://localhost:3000
        E2E_LLM_MOCK_URL: http://noj-e2e-llm-mock:8002/v1
        E2E_LLM_MOCK_INSPECT_URL: http://localhost:8002/
        E2E_LLM_GOVERNANCE_DATABASE_URL: ${{ env.E2E_DB_URL }}
        E2E_EVALUATOR_NETWORK: ${{ env.E2E_EVALUATOR_NETWORK || 'noj-eval-net' }}
      run: |
        if [ -n "${{ inputs.shard }}" ]; then
          deno task test:browser --shard "${{ inputs.shard }}" --groups "${{ inputs.groups }}"
        else
          deno task test:browser
        fi
      shell: bash

    - name: 上传 UI 浏览器诊断产物
      if: failure() && inputs.browser == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ui-browser-artifacts${{ inputs.shard != '' && format('-{0}', inputs.shard) || '' }}
        path: noj-tests/test-results/ui-browser/
        retention-days: 7
        if-no-files-found: ignore

    # ════════════════════════════════════════════
    # 4. 诊断日志（仅失败或取消时输出并上传，减少正常运行的日志采集耗时）
    # ════════════════════════════════════════════

    - name: 收集失败诊断日志
      if: failure() || cancelled()
      run: |
        compose=(docker compose -f docker-compose.e2e.yml -p "$COMPOSE_PROJECT_NAME")
        for svc in noj-migrate noj-judge noj-core noj-llm-gateway; do
          echo "=== $svc 日志（tail 100）==="
          "${compose[@]}" logs --tail=100 "$svc" 2>&1 || echo "容器可能未启动"
          "${compose[@]}" logs --tail=500 "$svc" > "$svc.log" 2>&1 || echo "$svc may not be running"
        done
      shell: bash

    - name: 上传诊断日志
      if: failure() || cancelled()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: e2e-${{ inputs.domain }}${{ inputs.shard != '' && format('-{0}', inputs.shard) || '' }}-logs
        path: |
          noj-judge.log
          noj-migrate.log
          noj-core.log
          noj-llm-gateway.log
          /tmp/noj-work/
        retention-days: 7
        if-no-files-found: ignore
      continue-on-error: true

    # ════════════════════════════════════════════
    # 5. 清理
    # ════════════════════════════════════════════

    - name: 清理评测栈
      if: always()
      run: |
        docker compose -f docker-compose.e2e.yml -p $COMPOSE_PROJECT_NAME down -v
      shell: bash
