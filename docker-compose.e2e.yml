# E2E 测试基础设施（独立端口/DB，与开发环境隔离）
services:
  redis:
    image: redis:7-alpine
    container_name: noj-e2e-redis
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: noj-e2e-postgres
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: e2e
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "e2e"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ── 对象存储（MinIO）──────────────────────────────────────────────────────
  # 镜像来源变更（2026-09-26）：MinIO 已停止免费分发，官方镜像全部下架——
  # `minio/minio`、`minio/mc`（Docker Hub 整组织）与 `quay.io/minio/*` 均返回
  # 404 / 无 manifest，`dl.min.io` 二进制也返回 410。此前钉的
  # `quay.io/minio/minio:RELEASE.2024-11-07` 已不可拉取，导致**全部 E2E job 在
  # 「初始化 MinIO bucket」步失败**（`main` 分支同样全红，与本仓库改动无关）。
  # 现改用 Bitnami 的冻结镜像源；MinIO 版本与原镜像**完全一致**
  # （RELEASE.2024-11-07），且该镜像同时内置 `minio` 与 `mc` 两个二进制。
  minio:
    image: bitnamilegacy/minio:2024.11.7-debian-12-r2
    container_name: noj-e2e-minio
    ports: ["9002:9000"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # 不传 command：Bitnami 的 run.sh 自行拼 `minio server ... ${MINIO_DATA_DIR}`
    # （原 `command: server /data` 会让其把 "/data" 当成未知参数追加到末尾）
    healthcheck:
      # 原健康检查 `mc ready local` 依赖官方镜像预置的 mc 别名配置，此处改为直接探活 API
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio-init:
    # mc 与 server 不同期：mc 用 2025-07，server 用 2024-11。
    # mc 是命令行客户端，跨 server 大半年版本无协议不兼容风险，比对齐版本更稳。
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    # 修复 finding C5：原 condition: service_started 在冷启动下过早触发，
    # mc alias set 连接偶尔被拒绝，entrypoint 里再 sleep 3 补补丁（脆弱）。
    # 改为 service_healthy 后等 minio 健康检查通过再起，sleep 3 也去掉。
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/noj-support-packages;
      "

  # ──────────────────────────────────────────────────────────────────────────
  # 拆分 prepare 步骤：把耗时 ~25-30min 的 migrate + seed 从 noj-core 容器里
  # 抽出为独立 one-shot 任务。这样 noj-core 容器只跑 HTTP server，
  # 冷启动从 ~30min 降到 ~1s，单 PR Full Pipeline 从 10-30min 降到 4-6min。
  #
  # noj-migrate 用 entrypoint "setup" 模式：dev-setup（迁移 + 初始化 + 题目导入）后退出。
  # noj-core depends_on service_completed_successfully → 等 noj-migrate 完后才起。
  # ──────────────────────────────────────────────────────────────────────────
  noj-migrate:
    build:
      context: ./noj-core
      dockerfile: Dockerfile.e2e
    image: noj-e2e-core
    container_name: noj-e2e-migrate
    entrypoint: ["/entrypoint.sh", "setup"]
    environment:
      DATABASE_URL: postgres://e2e:e2e@postgres:5432/e2e
      REDIS_URL: redis://redis:6379/1
      NOJ_RUN_E2E: "1"
      STORAGE_PROVIDER: local
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-false}"
      JWT_SECRET: e2e-ci-secret-fixed-value-with-32-chars-min-abc
      ADMIN_EMAIL: e2e_admin@test.com
      ADMIN_PASS: e2e_admin_pass
    # problem-bundle-import：dev-setup 在容器内完成构建 + 导入，
    # LocalStorageProvider 把剥离后评测包写入 /app/data/storage/<hash>.zip。
    # 这是容器内文件系统，noj-core 看不到，共享 volume 让评测包对 noj-core 可见。
    volumes:
      - noj-data-storage:/app/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  noj-core:
    build:
      context: ./noj-core
      dockerfile: Dockerfile.e2e
    image: noj-e2e-core
    container_name: noj-e2e-core
    ports: ["8099:8000"]
    # 健康探测。noj-core 只跑 server（migrate + seed 在 noj-migrate 里跑完了），
    # 启动 < 1s，健康检查几乎立即通过；start_period/retries 调到小值即可。
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # 关键改动：noj-core 不再自己跑 migrate + seed —— 由上游 noj-migrate one-shot
    # 提前完成。这条 entrypoint 跳过 ~25-30min 的 deno runtime 数据库初始化，
    # 直接监听 :8000。
    entrypoint: ["/entrypoint.sh", "serve"]
    environment:
      DATABASE_URL: postgres://e2e:e2e@postgres:5432/e2e
      REDIS_URL: redis://redis:6379/1
      JWT_SECRET: e2e-ci-secret-fixed-value-with-32-chars-min-abc
      TFA_ENCRYPTION_KEY: e2e-ci-tfa-encryption-key-with-32-chars-min-abc
      PORT: "8000"
      NOJ_RUN_E2E: "1"
      STORAGE_PROVIDER: local
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-false}"
      # 登录限流参数必须显式转发：compose 只注入此处列出的变量，
      # 否则 e2e-rate-limit job 设置的 IP_MAX/ACC_MAX/BACKOFF_SEC 不会
      # 进入容器，退避按默认 15s 生效会让用例跑 13min 并误判锁定失败。
      RATE_LIMIT_LOGIN_IP_MAX: "${RATE_LIMIT_LOGIN_IP_MAX:-10}"
      RATE_LIMIT_LOGIN_ACC_MAX: "${RATE_LIMIT_LOGIN_ACC_MAX:-5}"
      RATE_LIMIT_LOGIN_BACKOFF_SEC: "${RATE_LIMIT_LOGIN_BACKOFF_SEC:-15}"
      RATE_LIMIT_LOGIN_LOCK_THRESHOLD: "${RATE_LIMIT_LOGIN_LOCK_THRESHOLD:-10}"
      BCRYPT_SALT_ROUNDS: "4"
      # LLM Gateway：core 本地 mint eval_token 需要与 gateway 共享 service token。
      # evaluator 容器运行在默认 bridge，只能经宿主机 bridge 网关 IP 访问已发布端口的 gateway。
      NOJ_LLM_SERVICE_TOKEN: e2e-ci-llm-service-token-0123456789abcdef
      NOJ_LLM_GATEWAY_URL: http://172.17.0.1:8001
      # seed 管理员凭证（需与 noj-core/tests/e2e/helper.ts 默认值一致）
      ADMIN_EMAIL: e2e_admin@test.com
      ADMIN_PASS: e2e_admin_pass
    depends_on:
      noj-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # v13.4：与 noj-migrate 共享 /app/data/packages/，让 LocalStorageProvider
    # 写入的支持包对 noj-core 可见。
    volumes:
      - noj-data-storage:/app/data/storage

  noj-judge:
    build:
      context: ./noj-judge
      dockerfile: Dockerfile.e2e
    image: noj-e2e-judge
    container_name: noj-e2e-judge
    environment:
      REDIS_URL: redis://redis:6379/1
      JUDGE_QUEUE: noj:judge:queue
      RESULT_QUEUE: noj:judge:results
      MAX_CONCURRENT: "2"
      WORK_DIR: /tmp/noj-work
      JUDGE_INSTANCE_ID: noj-e2e-judge-1
      JUDGE_IMAGE_PREFIX: noj-
      JUDGE_COMMAND_WHITELIST: python3,deno,node,bash,sh
      # E2E capability-network 用例需要 evaluator 联网能力
      JUDGE_ALLOW_EVALUATOR_NETWORK: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - noj-judge-work:/tmp/noj-work
      # local 存储模式下 core 与 judge 共享文件系统，judge 直接读取 artifact/支持包
      - noj-data-storage:/app/data/storage
    # noj-judge 不再启动时经 Redis RPC 拉白名单；等 noj-core healthy 后再起，
    # 避免题目数据尚未迁移完成时评测任务消费异常。
    depends_on:
      redis:
        condition: service_healthy
      noj-core:
        condition: service_healthy

  # Mock LLM：OpenAI 兼容的假上游，供 LLM Gateway E2E 使用
  llm-mock:
    image: python:3.12-slim
    container_name: noj-e2e-llm-mock
    ports:
      - "8002:8002"
    command: |
      python3 -u -c "
      import json
      from http.server import BaseHTTPRequestHandler, HTTPServer
      class H(BaseHTTPRequestHandler):
        def do_GET(self):
          self.send_response(200); self.end_headers(); self.wfile.write(b'{\"ok\": true}')
        def do_POST(self):
          length = int(self.headers.get('Content-Length', 0)); self.rfile.read(length)
          body = json.dumps({'ok': True, 'choices': [], 'usage': {'prompt_tokens': 5, 'completion_tokens': 3, 'total_tokens': 8}}).encode()
          self.send_response(200)
          self.send_header('Content-Type', 'application/json'); self.send_header('Content-Length', str(len(body))); self.end_headers()
          self.wfile.write(body)
        def log_message(self, *args): pass
      HTTPServer(('0.0.0.0', 8002), H).serve_forever()
      "

  noj-llm-gateway:
    build:
      context: ./noj-llm-gateway
    image: noj-e2e-llm-gateway
    container_name: noj-e2e-llm-gateway
    ports:
      - "8001:8001"
    environment:
      NOJ_LLM_PORT: "8001"
      NOJ_LLM_SERVICE_TOKEN: e2e-ci-llm-service-token-0123456789abcdef
      NOJ_LLM_STORE_KEY: e2e-ci-llm-store-key-0123456789abcdef
      DATABASE_URL: postgres://e2e:e2e@postgres:5432/e2e
      REDIS_URL: redis://redis:6379/1
    depends_on:
      # 必须等 noj-migrate（core 迁移）成功后再启动，避免 core 与 gateway
      # 的迁移在同一批 LLM 表上并发执行 DDL。两侧迁移均为幂等，但串行化
      # 能避免冷启动时的建表/建索引竞争，并确保 gateway 启动前基础 schema
      # 已完成。
      noj-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  noj-judge-work:
  noj-data-storage:
