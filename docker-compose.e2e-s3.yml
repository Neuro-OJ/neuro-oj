# 真实 S3 支持包验收覆盖层：与基础 E2E 栈合并，数据库须由调用者显式指定。
services:
  noj-core:
    environment:
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: noj-support-packages
      S3_FORCE_PATH_STYLE: "true"
